<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Español">
<meta name="theme-color" content="#F9D2E0">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="icon-512.png?v=2">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>Repaso de Español</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Workbook: a menu of exercise cards (by tema) and toy shelves where plush rewards collect; one question per screen, tap-only for iPad */
:root{
  color-scheme:light;
  --bg:#F9D2E0; --surface:#FFFFFF; --baby:#A8D4F7; --baby-line:#7FBCEB; --baby-ink:#123A5E; --ink:#2A2418; --muted:#6B6250; --line:#DCD2B8;
  --sun:#D99A00; --sun-soft:#FCEFC7; --petal:#F4B400; --seed:#6B3F1D; --stem:#3E8E41; --leaf:#5DAE4B; --soil:#B68A5A; --soil2:#9C7246; --sky:#E4F1F8;
  --ok:#23804D; --ok-soft:#DDF2E4; --bad:#C23B34; --bad-soft:#F9DEDB; --sel:#2B63D1; --sel-soft:#DCE7FB;
  --ton:#2B63D1; --ton-soft:#DCE7FB; --aton:#C23B34; --aton-soft:#F9DEDB;
  --wood:#A86F3E; --wood2:#C68A52; --wood3:#7E4F28; --wall:#FFF6EA; --wall2:#F6E6CE;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--sel);outline-offset:2px}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--sun);font-weight:800}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:2px 0 0;text-wrap:balance}
.total{font-family:var(--display);font-weight:800;font-size:20px;background:var(--sun-soft);border-radius:999px;padding:4px 14px;white-space:nowrap}
.total b{color:var(--sun)}

/* peluches: repisas tipo juguetera */
.toys{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px 14px;margin-top:16px;display:flex;flex-direction:column;gap:12px}
.toys .gh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.toys h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0}
.toys .gn{font-family:var(--display);font-weight:800;color:var(--sun);font-size:20px}
.toys p{margin:0;color:var(--muted);font-size:14.5px}
.toys h3{font-family:var(--display);font-weight:800;font-size:17px;margin:0 0 4px;display:flex;justify-content:space-between}
.toys h3 span{color:var(--muted);font-size:15px}
.cab{background:linear-gradient(180deg,var(--wall),var(--wall2));border:9px solid var(--wood);border-radius:14px;padding:6px 6px 0;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:inset 0 6px 12px rgba(0,0,0,.12)}
.slot{position:relative;box-sizing:border-box;width:100%;margin:0;aspect-ratio:1/1.05;border:none;background:transparent;padding:0;font:inherit;line-height:0;border-bottom:7px solid var(--wood2);box-shadow:0 3px 0 -1px var(--wood3)}
.slot .toy{position:absolute;left:2%;bottom:0;width:96%;height:auto}
.toy.photo{object-fit:contain;aspect-ratio:1/1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.22))}
.slot.royal{background:radial-gradient(circle at 50% 60%,rgba(255,206,84,.55),rgba(255,206,84,0) 70%)}
.slot.special{background:radial-gradient(circle at 50% 60%,rgba(255,120,200,.45),rgba(120,200,255,.25) 45%,rgba(255,255,255,0) 72%)}
.slot.doll{background:radial-gradient(circle at 50% 58%,rgba(255,205,60,.75),rgba(255,205,60,0) 72%);animation:dollbg 1.8s ease-in-out infinite}
.toy.glow,.slot.doll .toy{animation:dollglow 1.8s ease-in-out infinite}
@keyframes dollglow{0%,100%{filter:drop-shadow(0 0 4px rgba(255,200,40,.7)) drop-shadow(0 0 10px rgba(255,215,0,.5))}50%{filter:drop-shadow(0 0 12px rgba(255,200,40,1)) drop-shadow(0 0 28px rgba(255,215,0,.9))}}
@keyframes dollbg{0%,100%{background-size:100% 100%}50%{background-size:125% 125%}}
.newtoys .dollwin .toy{width:220px;height:220px}
@media (prefers-reduced-motion:reduce){.toy.glow,.slot.doll .toy,.slot.doll{animation:none}}
.slot.empty::before{content:"?";position:absolute;inset:18% 20% 10%;border:2px dashed var(--line);border-radius:50%;display:grid;place-items:center;color:var(--muted);font:800 18px var(--display);opacity:.6}
.slot.new .toy{animation:drop .8s cubic-bezier(.3,1.5,.5,1) both}
@keyframes drop{0%{transform:translateY(-40%) scale(.4);opacity:0}100%{transform:none;opacity:1}}
.newtoys{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.newtoys figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800}
.newtoys .royalwin .toy{width:170px;height:170px;filter:drop-shadow(0 0 12px rgba(255,200,60,.8))}
.newtoys .toy{width:130px;height:130px;animation:drop .9s cubic-bezier(.3,1.5,.5,1) both}
.toybar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.toybar .mini{display:flex;gap:2px;flex:1;min-width:0;overflow:hidden}
.toybar .mini .toy{width:58px;height:58px;flex:none}
.toybar .none{color:var(--muted);font-size:15px;flex:1}
.chipw{background:var(--baby);color:var(--baby-ink);border:2px solid var(--baby-line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:14.5px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:16px}
.pcard{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 16px;text-align:left}
.pcard:hover{border-color:var(--sun)}
.pcard .pav{width:80px;height:80px;flex:none;display:grid;place-items:center;font-size:44px;background:var(--sun-soft);border-radius:16px}
.pcard .pav .toy{width:76px;height:76px}
.pcard .pn{display:block;font-family:var(--display);font-weight:800;font-size:21px;line-height:1.1}
.pcard .ps{color:var(--muted);font-size:14px}
.newp{background:var(--surface);border:2px solid var(--sun);border-radius:18px;padding:16px;margin-top:16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.newp input{font:800 24px var(--display);text-align:center;width:min(100%,380px);padding:10px 12px;border:3px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(20,14,6,.55);display:grid;place-items:center;padding:16px;z-index:10}
.modal .box{background:var(--surface);border-radius:22px;padding:18px 22px;text-align:center;max-width:340px;width:100%;display:flex;flex-direction:column;gap:6px;align-items:center}
.modal .toy{width:min(260px,70vw);height:auto}
.modal .nm{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1}
.modal .ct{color:var(--muted);font-size:14px}

.revbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--baby);color:var(--baby-ink);border:2px solid var(--baby-line);border-radius:16px;padding:14px 16px;margin-top:16px}
.revbtn .ico{font-size:30px;line-height:1}
.revbtn .t{font-weight:800;font-size:18px;display:block}
.revbtn .s{font-size:14px;opacity:.85}

.group h2{font-family:var(--display);font-size:22px;margin:6px 0 8px;font-weight:800}
.crownp{font-family:var(--body);font-size:14px;font-weight:800;background:#FFF1C7;color:#8A6300;border-radius:999px;padding:2px 10px;vertical-align:middle;margin-left:6px}
.group p.gdesc{margin:-6px 0 10px;color:var(--muted);font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:100px}
.card.exam{border:3px solid var(--aton);background:#FFF4F6}
.card.exam .t{color:var(--aton)}
.card.exam{position:relative;padding-right:110px;grid-column:span 2;min-height:118px}
@media (max-width:480px){.card.exam{grid-column:auto}}
.prize{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:96px;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:800;color:#C2187A;text-align:center;line-height:1.1}
.prize .toy{width:88px;height:88px;filter:grayscale(.85) opacity(.55)}
.prize.got .toy{filter:none}
.topic{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,36px);line-height:1.1;color:#D21F3C;text-transform:uppercase;letter-spacing:.02em;margin-bottom:4px}
.pertabs{display:flex;gap:8px;margin-top:20px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:5px}
.ptab{flex:1;border:none;border-radius:999px;padding:10px 12px;font-weight:800;font-size:17px;background:transparent;color:var(--muted)}
.ptab.on{background:var(--baby);color:var(--baby-ink);box-shadow:0 1px 0 var(--baby-line)}
.card:hover{border-color:var(--sun)}
.card .t{font-weight:800;font-size:18px;line-height:1.2}
.card .s{font-size:13px;color:var(--muted)}
.card .st{margin-top:auto;font-size:20px;letter-spacing:2px;color:var(--line)}
.card .st .on{color:var(--sun)}

/* play */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{background:var(--baby);color:var(--baby-ink);border:2px solid var(--baby-line);border-radius:999px;padding:6px 14px;font-weight:800}
.ptitle{font-family:var(--display);font-size:clamp(22px,5vw,30px);font-weight:800;margin:0;line-height:1.1;flex:1;min-width:0}
.rule{background:var(--surface);border:2px dashed var(--sun);border-radius:14px;padding:10px 14px;font-size:15.5px}
.rule summary{font-weight:800;color:var(--sun);cursor:pointer;list-style:none}
.rule summary::-webkit-details-marker{display:none}
.rule summary::before{content:"📒 "}
.rule div{margin-top:6px;line-height:1.5}
.inst{background:var(--sun-soft);border-radius:12px;padding:10px 14px;font-weight:600}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:15px;color:var(--muted);font-weight:700}
.prog{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--sun);transition:width .3s}
#fb{min-height:26px;font-weight:800;text-align:center}
#fb.ok{color:var(--ok)} #fb.bad{color:var(--bad)}

.qp{font-weight:800;font-size:18px;text-align:center}
.qcard{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:22px 16px;text-align:center}
.word{font-family:var(--display);font-weight:800;font-size:clamp(34px,8vw,52px);line-height:1.15;overflow-wrap:anywhere}
.word.long{font-family:var(--body);font-size:clamp(22px,5vw,28px);line-height:1.5}
.word u{text-decoration-thickness:3px;text-underline-offset:5px;text-decoration-color:var(--sun)}
.hole{display:inline-block;min-width:1.1em;padding:0 .12em;border-bottom:4px solid var(--sel);background:var(--sel-soft);border-radius:8px 8px 0 0;color:var(--sel)}
.hole.ok{border-bottom-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 20px;font-weight:800;font-size:20px;min-width:72px}
.opt.small{font-size:17px;padding:12px 16px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);opacity:.6}

.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.bucket{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:stretch;gap:8px;min-height:130px}
.bucket .bh{font-family:var(--display);font-weight:800;font-size:20px;border-bottom:3px solid var(--sun);padding-bottom:4px;text-align:center}
.bucket .bl{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.bucket .bl span{background:var(--sun-soft);border-radius:8px;padding:2px 8px;font-size:14.5px;font-weight:700}
.bucket.bad{border-color:var(--bad);background:var(--bad-soft)}
.bucket.ok{border-color:var(--ok)}

.sent{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;font-size:22px}
.tok.ok{border-color:var(--sel);background:var(--sel-soft);color:var(--sel)}
.tok.bad{border-color:var(--bad);background:var(--bad-soft)}
.qinst{font:800 21px var(--display);text-align:center;line-height:1.35;background:var(--surface);border:3px solid var(--line);border-radius:16px;padding:10px 14px;margin:0 0 10px}
.flash{animation:flashi 1.4s ease-in-out 2}
@keyframes flashi{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 5px #FFB020;background:#FFF3CF}}
.tok.sel{border-color:var(--sel);background:var(--sel-soft);color:var(--sel)}
.chk{display:flex;flex-direction:column;gap:8px;margin:12px auto;max-width:560px}
.chk label{display:flex;gap:10px;align-items:center;font-weight:700;font-size:18px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.chk input{width:24px;height:24px}
.bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.bank span{background:var(--sun-soft);border:2px solid var(--sun);border-radius:10px;padding:3px 10px;font-weight:800}
.rd input,.rd textarea{font:700 20px var(--body);padding:10px 12px;border:3px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
.rd textarea{min-height:190px}
.parent{margin-top:26px;color:var(--muted);font-size:14px;text-align:center}
.tok.blu{border-color:var(--ton);background:var(--ton-soft);color:var(--ton)}
.tok.red{border-color:var(--aton);background:var(--aton-soft);color:var(--aton)}
.tok.miss{outline:3px dashed var(--bad)}
.pens{display:flex;gap:10px;justify-content:center;margin:10px 0}
.pen{font:800 18px var(--display);padding:8px 16px;border-radius:999px;border:3px solid var(--line);background:var(--surface)}
.pen.blu.on{border-color:var(--ton);background:var(--ton-soft);color:var(--ton)}
.pen.red.on{border-color:var(--aton);background:var(--aton-soft);color:var(--aton)}
.wr{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.wr .bad-s{font:700 22px var(--display);text-align:center;color:var(--muted)}
.wr textarea{font:700 22px var(--display);padding:10px 12px;border:3px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);min-height:96px;width:100%;box-sizing:border-box}
.wr textarea.bad{border-color:var(--bad);background:var(--bad-soft)}
.wr textarea.ok{border-color:var(--ok);background:var(--ok-soft)}
.wr .hint{color:var(--muted);font-size:18px;text-align:center}
.wr .show{font:800 22px var(--display);color:var(--ok);text-align:center}
.trow{display:grid;gap:10px}
.tcol{display:flex;flex-direction:column;gap:6px}
.tcol .th{font-weight:800;font-size:16px;color:var(--muted)}
.tcol .ops{display:flex;gap:8px;flex-wrap:wrap}
.tcol .op{font:700 18px var(--display);padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface)}
.tcol .op.on{border-color:var(--sel);background:var(--sel-soft);color:var(--sel)}
.tcol .op.ok{border-color:var(--ok);background:var(--ok-soft)}
.tcol .op.bad{border-color:var(--bad);background:var(--bad-soft)}

.letters{display:flex;justify-content:center;align-items:stretch;flex-wrap:nowrap;font-family:var(--display);font-weight:800;font-size:clamp(22px,6.2vw,54px);line-height:1}
.letters .lt{padding:8px 0}
.gap{border:none;background:transparent;width:30px;margin:0 -2px;border-radius:8px;position:relative;font-family:var(--display);font-weight:800;color:var(--bad);font-size:clamp(30px,8vw,44px);padding:0}
.gap::after{content:"";position:absolute;left:50%;top:14%;bottom:14%;border-left:3px dotted var(--muted);opacity:.55}
.gap.on::after{display:none}
.gap.on{background:var(--bad-soft)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border-radius:999px;padding:11px 22px;font-weight:800;border:2px solid var(--baby-line);background:var(--baby);color:var(--baby-ink);font-size:17px}
.btn.alt{background:var(--surface);color:var(--baby-ink);border-color:var(--baby-line)}

.syls{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.syl{background:var(--surface);border:3px solid var(--line);border-radius:14px;padding:10px 16px;font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,44px);line-height:1;min-width:64px}
.syl.ton{border-color:var(--ton);background:var(--ton-soft);color:var(--ton)}
.syl.aton{border-color:var(--aton);background:var(--aton-soft);color:var(--aton)}
.sylw{display:flex;flex-direction:column;align-items:center;gap:4px}
.syll{font-weight:800;font-size:15px;min-height:20px;text-transform:uppercase;letter-spacing:.04em}
.syll.ton{color:var(--ton)} .syll.pos{color:var(--muted);text-transform:none;font-size:13px}
.syll.pos.ton{color:var(--ton)} .syll.aton{color:var(--aton)}
.syl.bad{border-color:var(--bad);background:var(--bad-soft)}
.say{background:var(--baby);color:var(--baby-ink);border:2px solid var(--baby-line);border-radius:999px;padding:8px 16px;font-weight:800}
.saybig{font-size:22px;padding:14px 26px}
.dict{display:flex;flex-direction:column;gap:12px;align-items:center}
.dict .hint{color:var(--muted);font-size:18px;text-align:center}
.dict input{font:800 30px var(--display);text-align:center;width:min(100%,380px);padding:10px 12px;border:3px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink)}
.dict input.bad{border-color:var(--bad);background:var(--bad-soft)}
.dict input.ok{border-color:var(--ok);background:var(--ok-soft)}
.dict .show{font-family:var(--display);font-weight:800;font-size:28px;color:var(--ok)}

.note{background:var(--surface);border:2px solid var(--sun);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;font-weight:700}
.note .why{font-size:17px}

/* matching (une) */
.match{position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:44px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.mi{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;font-weight:700;font-size:17px;line-height:1.25;min-height:52px}
.mi .pt{position:absolute;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--ink);border:2px solid var(--surface)}
.left .mi .pt{right:-8px} .right .mi .pt{left:-8px}
.mi.sel{border-color:var(--sel);background:var(--sel-soft)}
.mi.ok{border-color:var(--ok);background:var(--ok-soft)}
.mi.ok .pt{background:var(--ok)}
.mi.bad{border-color:var(--bad);background:var(--bad-soft)}
.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.lines line{stroke-width:4;stroke-linecap:round}
.lines .ok{stroke:var(--ok)} .lines .bad{stroke:var(--bad)}

const RULE_ACEN = '<b>Agudas:</b> se pronuncian con mayor intensidad en la <b>última</b> sílaba. Ejemplo: pa-<b>red</b>, me-<b>nú</b>.<br><b>Graves:</b> en la <b>penúltima</b> sílaba. Ejemplo: hor-<b>mi</b>-ga, i-<b>ma</b>-gen.<br><b>Esdrújulas:</b> en la <b>antepenúltima</b> sílaba. Ejemplo: <b>ú</b>-ni-co, <b>mé</b>-di-ca.<br><b>Sobresdrújulas:</b> en una sílaba <b>anterior a la antepenúltima</b>. Ejemplo: <b>dí</b>-ga-me-lo.<br>¡Ojo! Primero encuentra la tónica y luego <b>cuenta desde el final</b>: última (1), penúltima (2), antepenúltima (3). Que una palabra tenga acento (´) <b>no</b> quiere decir que sea aguda: fa-<b>ná</b>-ti-co es esdrújula y a-<b>zú</b>-car es grave.';

const TA = (s, a, alt) => ({s, a, alt, why: /^(el|la|lo|los|las)$/i.test(a) ? `«${a}» es un artículo determinado.` : `«${a}» es un artículo indeterminado.`});

// MK: arma rondas de «toca todas las que…». pos/neg: listas [palabra]. Una de cada 4 pide lo CONTRARIO y algunas piden además escribir cuántas.
function MK(pos, neg, P, N, whyP, whyN) {
  const items = [], pick = (a, k) => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]).slice(0, k);
  for (let r = 0; r < 12; r++) {
    const a = pick(pos, 3 + (r % 3)), b = pick(neg, 7 - (r % 3) - (r % 2)), words = a.concat(b);
    const inv = r % 4 === 3, cnt = r % 3 === 1;
    const ok = inv ? b : a, inst = (inv ? N : P) + (cnt ? ' Después escribe <b>cuántas</b> tocaste.' : '');
    items.push({ words, ok, inst, count: cnt, why: (inv ? whyN : whyP)(ok) });
  }
  return items;
}

function awardToys(n) {

    if (!pool.length) pool = free;

  }

function crownCheck(act, stars) {
  if (stars < 3) return null;
  const list = crown[act.g] = crown[act.g] || [];
  if (!list.includes(act.id)) list.push(act.id);
  const all = ACTS.filter(a => a.g === act.g).map(a => a.id);
  let got = null;
  if (all.every(id => list.includes(id))) {
    const free = ROYALS.filter(r => !royals.includes(r.id));
    if (free.length) { got = royals.length ? free[Math.floor(Math.random() * free.length)] : free[0]; royals.push(got.id); save(K('royals'), royals); }
    crown[act.g] = [];
  }
  save(K('crown'), crown); return got;
}

      + (!rg && ROYALS.some(r => !royals.includes(r.id)) ? `<div style="color:var(--muted);font-size:15px">👑 ${esc(G.h)}: ${done3} de ${sec.length} prácticas con 3 ★ para el peluche real.</div>` : '');

}

    $('#ck').onclick = () => {

      const arts = toks.map((t, j) => j).filter(j => want[j]); if (arts.length > 1 && arts.every(j => col[j] && col[j] !== want[j])) { instrErr(q, 'Revisa la instrucción: ¿qué color va con los determinados y cuál con los indeterminados?', $('#st')); return; }
      const missing = wrong.filter(j => want[j] && !col[j]).length, extra = wrong.filter(j => !want[j]).length, swapped = wrong.length - missing - extra;

  /* Lee la instrucción: toca TODAS las palabras que pide (a veces pide las que NO son…) */
  marca(q, it) {
    const sel = new Set(), words = it.keep ? it.words : shuffle(it.words);
    let step = 1;
    const draw = () => `${words.map((w, j) => `<button class="tok${sel.has(w) ? ' sel' : ''}" type="button" data-w="${esc(w)}">${esc(w)}</button>`).join('')}`;

    const clean = w => w.replace(/[.,;:¡!¿?]/g, '');
    $('#ck').onclick = () => {
      if (cur.over) return;

        wrongQ(q, $('#cn')); return; }
      if (!sel.size) { fb('bad', 'Toca las palabras que pide la instrucción.'); return; }
      const okSet = new Set(it.ok), shown = words.filter(w => okSet.has(w)), other = words.filter(w => !okSet.has(w));
      const good = shown.length === sel.size && shown.every(w => sel.has(w));

        rightQ(q, it.why, 1); return; }
      // ¿tocó justo lo contrario? → no leyó la instrucción
      const opp = other.length && other.length === sel.size && other.every(w => sel.has(w));
      const mostlyOpp = [...sel].filter(w => !okSet.has(w)).length >= Math.max(2, Math.ceil(sel.size * 0.75));

  /* Separa en sílabas y clasifica */

      $('#ph2').innerHTML = `<div class="opts" id="op">${ACEN_N.map((x, k) => `<button class="opt small" type="button" data-k="${k}">${x}</button>`).join('')}</div>`;
      $('#op').onclick = ev => { const o = ev.target.closest('.opt'); if (!o || cur.over || o.disabled) return;
        if (+o.dataset.k === it.k) { o.classList.add('ok', 'pop'); rightQ(q, it.why, true); }
        else { o.classList.add('bad'); o.disabled = true; wrongQ(q, o); } };
    };
    const step2 = () => {
      $('#ac').innerHTML = '';
      $('#ap').textContent = '2. Toca la sílaba tónica.';
      $('#lt').outerHTML = `<div class="syls" id="sy">${S.map((x, j) => `<div class="sylw"><button class="syl" type="button" data-j="${j}">${esc(x)}</button><span class="syll" id="sl${j}"></span></div>`).join('')}</div>`;
      let phase = 'ton'; const at = new Set();
      $('#sy').onclick = e => { const b = e.target.closest('.syl'); if (!b || cur.over || phase === 'done') return; const j = +b.dataset.j;
        if (phase === 'ton') {
          if (j !== it.t) { b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 600); wrongQ(q, b); return; }
          b.classList.add('ton'); $('#sl' + j).textContent = 'tónica'; $('#sl' + j).className = 'syll ton'; fb('ok', '¡Bien!');
          if (S.length === 1) { phase = 'done'; step3(); return; }
          phase = 'aton'; $('#ap').textContent = '2. Ahora toca las sílabas átonas.'; return; }
        if (j === it.t || at.has(j)) return;
        at.add(j); b.classList.add('aton'); $('#sl' + j).textContent = 'átona'; $('#sl' + j).className = 'syll aton';
        if (at.size === S.length - 1) { phase = 'done'; fb('ok', '¡Bien!'); step3(); } };
    };
    $('#ck').onclick = () => {
      if (cur.over) return;
      if (on.size === cuts.size && [...cuts].every(j => on.has(j))) { fb('ok', '¡Bien separada!'); step2(); return; }
      tries++; wrongQ(q, $('#lt'));
      if (tries >= 3) { $('#ck').disabled = true; fb('bad', `Se separa así: ${it.s}`); setTimeout(step2, 1600); }
    };
  },
  acen(q, it) {
    const S = it.s.split('-'), n = S.length, pos = j => n - 1 - j;
    $('#area').innerHTML = `<div class="qp" id="ap">Paso 1: 🔵 toca la sílaba <span style="color:var(--ton)">TÓNICA</span> de «${esc(it.word)}»</div>
      <div class="qcard"><div class="syls" id="sy">${S.map((x, j) => `<div class="sylw"><button class="syl" type="button" data-j="${j}">${esc(x)}</button><span class="syll" id="sl${j}"></span></div>`).join('')}</div></div>
      <div class="actions"><button class="say" type="button" id="say">🔊 Oír</button></div><div id="ph2"></div>`;
    $('#say').onclick = () => speak(it.word, 0.7);
    $('#sy').onclick = e => {
      const b = e.target.closest('.syl'); if (!b || cur.over || $('#ph2').innerHTML) return; const j = +b.dataset.j;
      if (j !== it.t) { b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 600); wrongQ(q, b); return; }
      S.forEach((x, k) => { $(`.syl[data-j="${k}"]`).classList.add(k === it.t ? 'ton' : 'aton'); const p = pos(k); $('#sl' + k).textContent = p < 3 ? ACEN_POS[p] : ''; $('#sl' + k).className = 'syll pos' + (k === it.t ? ' ton' : ''); });
      fb('ok', '¡Esa es la tónica!');
      $('#ap').innerHTML = 'Paso 2: la tónica es la <span style="color:var(--ton)">' + (it.k < 3 ? ACEN_POS[it.k] : 'anterior a la antepenúltima') + '</span>. ¿Qué tipo de palabra es?';
      $('#ph2').innerHTML = `<div class="opts" id="op">${ACEN_N.map((x, k) => `<button class="opt small" type="button" data-k="${k}">${x}</button>`).join('')}</div>`;
      $('#op').onclick = ev => {
        const o = ev.target.closest('.opt'); if (!o || cur.over || o.disabled) return;
        if (+o.dataset.k === it.k) { o.classList.add('ok', 'pop'); rightQ(q, `<span style="color:var(--ton)">🔵 ${esc(it.show)}</span>: la fuerza va en la <b>${ACEN_POS[it.k]}</b> sílaba → <b>${ACEN_N[it.k].toLowerCase()}</b>.`, true); }
        else { o.classList.add('bad'); o.disabled = true; wrongQ(q, o); }
      };
    };
  },
  /* Dictado */
  dict(q, it) {
    const can = 'speechSynthesis' in window;
    const blank = it.s.replace(new RegExp(it.w, 'i'), '_____');
    $('#area').innerHTML = `<div class="dict">
      ${can ? '<button class="say saybig" type="button" id="say">🔊 Escuchar</button>' : '<div class="hint">Pide a alguien que te dicte la palabra.</div>'}
      <div class="hint">${esc(blank)}</div>
      <input id="in" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text" enterkeyhint="done" aria-label="Escribe la palabra">
      <div class="actions"><button class="btn" type="button" id="ck">Revisar ✓</button></div><div id="sh"></div></div>`;
    const say = () => speak([it.w, it.s, it.w]);
    if (can) { $('#say').onclick = say; setTimeout(say, 350); }
    const inp = $('#in'); let tries = 0;
    const strip = s => s.normalize('NFD').replace(/[̀-́̈]/g, '').normalize('NFC');
    const norm = s => s.normalize('NFC').trim().toLowerCase().replace(/\s+/g, ' ');
    const accented = /[áéíóúü]/.test(it.w);
    const check = () => {
      if (cur.over) return;
      const v = norm(inp.value); if (!v) return;
      if (v === it.w) { inp.classList.add('ok'); inp.blur(); rightQ(q, accented ? `Se escribe «${it.w}», con acento.` : `Se escribe «${it.w}».`); return; }
      tries++; inp.classList.add('bad'); setTimeout(() => inp.classList.remove('bad'), 700); wrongQ(q, inp);
      // Las letras están bien pero el acento no: cuenta como error y no avanza hasta que lo escriban bien.
      if (strip(v) === strip(it.w)) {
        fb('bad', accented ? '¡Casi! Revisa el acento (´).' : '¡Casi! Esta palabra no lleva acento.');
        if (tries >= 2) $('#sh').innerHTML = `<div class="hint">${accented ? 'Lleva acento:' : 'No lleva acento:'}</div><div class="show">${esc(it.w)}</div><div class="hint">Escríbela tú para seguir.</div>`;
        return;
      }
      if (tries >= 2) $('#sh').innerHTML = `<div class="hint">Se escribe:</div><div class="show">${esc(it.w)}</div><div class="hint">Escríbela tú para seguir.</div>`;
    };
    $('#ck').onclick = check;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
  }
};

/* ---------- Sílaba tónica (azul) / átonas (rojo) ---------- */
function silRender(q, it, mode) {
  const S = it.s.split('-'), word = S.join(''), need = mode === 'ton' ? 1 : S.length - 1, got = new Set();
  $('#area').innerHTML = `<div class="qp">${mode === 'ton' ? `🔵 ¿Cuál es la sílaba <span style="color:var(--ton)">TÓNICA</span> de «${esc(word)}»?`
      : `🔴 Toca las sílabas <span style="color:var(--aton)">ÁTONAS</span> de «${esc(word)}» ${need > 1 ? `(son ${need})` : '(es 1)'}`}</div>
    <div class="qcard"><div class="syls" id="sy">${S.map((x, j) => `<div class="sylw"><button class="syl" type="button" data-j="${j}">${esc(x)}</button><span class="syll" id="sl${j}"></span></div>`).join('')}</div></div>
    <div class="actions"><button class="say" type="button" id="say">🔊 Oír</button></div>`;
  $('#say').onclick = () => speak(word, 0.7);
  const reveal = () => {
    S.forEach((x, k) => { const b = $(`.syl[data-j="${k}"]`); b.classList.remove('bad'); b.classList.add(k === it.t ? 'ton' : 'aton'); $('#sl' + k).textContent = k === it.t ? 'tónica' : 'átona'; $('#sl' + k).className = 'syll ' + (k === it.t ? 'ton' : 'aton'); });
    const at = S.filter((x, k) => k !== it.t);
    rightQ(q, `<span style="color:var(--ton)">🔵 Tónica: «${S[it.t]}»</span> (la que suena más fuerte)<br><span style="color:var(--aton)">🔴 ${at.length === 1 ? 'Átona' : 'Átonas'}: ${at.map(x => '«' + x + '»').join(', ')}</span> (suenan más suave)`, true);
  };
  $('#sy').onclick = e => {
    const b = e.target.closest('.syl'); if (!b || cur.over) return; const j = +b.dataset.j;
    const ok = mode === 'ton' ? j === it.t : j !== it.t;
    if (!ok) { b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 600); wrongQ(q, b); return; }
    if (mode === 'ton') return reveal();
    if (got.has(j)) return;
    got.add(j); b.classList.add('aton', 'pop'); $('#sl' + j).textContent = 'átona'; $('#sl' + j).className = 'syll aton';
    if (got.size === need) reveal(); else fb('ok', `¡Bien! Te ${need - got.size === 1 ? 'falta 1' : 'faltan ' + (need - got.size)}.`);
  };
}

/* ---------- Une con líneas ---------- */
function renderUnir(act) {
  const pairs = shuffle(act.pairs).slice(0, 5);
  cur.total = pairs.length;
  const Lf = shuffle(pairs.map((p, k) => ({ t: p[0], k }))), Rt = shuffle(pairs.map((p, k) => ({ t: p[1], k })));
  const col = (arr, side) => arr.map(x => `<button class="mi" type="button" data-side="${side}" data-k="${x.k}">${esc(x.t)}<span class="pt"></span></button>`).join('');
  $('#area').innerHTML = `<div class="qp">${act.id === 'conjunto' ? 'Un conjunto de… se llama…' : 'Masculino → femenino'}</div>
    <div class="match" id="match"><svg class="lines" id="lines" aria-hidden="true"></svg>
    <div class="col left">${col(Lf, 'L')}</div><div class="col right">${col(Rt, 'R')}</div></div>`;
  const box = $('#match'), sel = { L: null, R: null }, matched = new Set();
  let temp = null;
  const btn = (side, k) => box.querySelector(`.mi[data-side="${side}"][data-k="${k}"]`);
  function draw() {
    const b = box.getBoundingClientRect(), svg = $('#lines'); if (!svg) return;
    svg.setAttribute('viewBox', `0 0 ${b.width} ${b.height}`);
    const seg = (kl, kr, cls) => { const l = btn('L', kl).getBoundingClientRect(), r = btn('R', kr).getBoundingClientRect();
      return `<line class="${cls}" x1="${l.right - b.left}" y1="${l.top + l.height / 2 - b.top}" x2="${r.left - b.left}" y2="${r.top + r.height / 2 - b.top}"/>`; };
    svg.innerHTML = [...matched].map(k => seg(k, k, 'ok')).join('') + (temp ? seg(temp[0], temp[1], 'bad') : '');
  }
  box.addEventListener('click', e => {
    const b = e.target.closest('.mi'); if (!b || b.classList.contains('ok') || cur.over) return;
    const side = b.dataset.side, k = +b.dataset.k;
    if (sel[side] !== null) btn(side, sel[side]).classList.remove('sel');
    if (sel[side] === k) { sel[side] = null; return; }
    sel[side] = k; b.classList.add('sel');
    if (sel.L === null || sel.R === null) return;
    const bl = btn('L', sel.L), br = btn('R', sel.R);
    bl.classList.remove('sel'); br.classList.remove('sel');
    if (sel.L === sel.R) {
      matched.add(sel.L); bl.classList.add('ok', 'pop'); br.classList.add('ok', 'pop'); draw();
      cur.done++; fb('ok', PRAISE[Math.floor(Math.random() * PRAISE.length)]); progress();
      if (cur.done === cur.total) setTimeout(finish, 600);
    } else {
      temp = [sel.L, sel.R]; draw(); bl.classList.add('bad'); br.classList.add('bad');
      cur.mistakes++; addErrTot(cur.act.id); fb('bad', 'Casi. Inténtalo otra vez.'); progress(); shake(bl); shake(br);
      setTimeout(() => { temp = null; bl.classList.remove('bad'); br.classList.remove('bad'); draw(); }, 700);
    }
    sel.L = sel.R = null;
  });
  new ResizeObserver(draw).observe(box);
}

if (me()) { loadPlayer(PID); $('#home').hidden = false; renderHome(); } else showWho();
$('#whochip').onclick = showWho;
</script>
