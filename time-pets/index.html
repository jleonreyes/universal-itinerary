<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Time Pets">
<meta name="theme-color" content="#EAF1F8">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Time Pets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&display=swap">
<style>
html,body{margin:0}body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one column "time track" of eras; each lesson is a page of a school notebook (blue rules, red margin, red pencil headings, green teacher tick). Single light look on purpose. */
:root{
  --bg:#EAF1F8; --ink:#1E2A3A; --ink-soft:#56667B; --card:#FFFFFF;
  --rule:#CDDCEF; --margin:#F1A3A8; --red:#D9434B; --green:#2E9E6B;
  --gold:#F5C84C; --mark:#FFE68A; --ok-bg:#DDF4E8; --no-bg:#FCE2E3; --blank:#FFFBE6;
  --f-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Andika','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.45}
.wrap{max-width:800px;margin:0 auto;padding-inline:16px;padding-block:12px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
button{font:inherit;color:inherit}
.btn{font-family:var(--f-display);font-size:20px;padding:10px 20px;border-radius:14px;border:3px solid var(--ink);background:var(--gold);box-shadow:0 4px 0 var(--ink);cursor:pointer;line-height:1.2}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.white{background:var(--card)}
.btn.small{font-size:16px;padding:6px 12px;border-width:2.5px;box-shadow:0 3px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid #3A7FC0;outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--ink-soft)}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2.5px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.gem{width:20px;height:20px;flex:none}
.brand{display:flex;align-items:center;gap:14px}
.appicon{width:92px;height:92px;border-radius:22px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);flex:none;display:block}
@media (max-width:420px){.appicon{width:72px;height:72px;border-radius:18px}}
.logo{font-family:var(--f-display);font-size:44px;line-height:1}
.logo span{color:var(--red)}
.tag{font-size:18px;color:var(--ink-soft)}
.stage{position:relative;border:3px solid var(--ink);border-radius:22px;overflow:hidden;background:#cfe6ff;min-height:240px}
.stage .scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage .petbox{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:min(46%,220px)}
.stage .era-label{position:absolute;left:12px;top:10px;display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.9);border:2.5px solid var(--ink);border-radius:12px;padding:4px 10px}
.stage .era-label b{font-family:var(--f-display);font-weight:400;font-size:18px}
.stage .era-label small{font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.bubble{position:absolute;right:12px;top:10px;max-width:46%;background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:6px 10px;font-size:15px;line-height:1.3}
.bar{height:16px;border:2.5px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7FD3F5,#5CC8A8)}
.petcard{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
.petcard h2{font-size:26px}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.pcard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:10px 14px;cursor:pointer}
.pcard .pw{width:96px;flex:none}
.pcard h3{font-size:24px;line-height:1.1}
.pcard .sub{font-size:15px;color:var(--ink-soft)}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700}
.inp{font-family:var(--f-body);font-size:22px;padding:6px 12px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);width:100%;min-width:0}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--card),0 0 0 7px var(--ink)}
.newgrid{display:grid;grid-template-columns:1fr 220px;gap:18px;align-items:center}
@media (max-width:560px){.newgrid{grid-template-columns:1fr}.newgrid .prev{width:180px;margin:0 auto}}
.track{display:flex;flex-direction:column}
.era{display:grid;grid-template-columns:150px 1fr;background:var(--card);border:3px solid var(--ink);border-radius:18px;overflow:hidden}
.era .thumb{position:relative;min-height:130px;border-right:3px solid var(--ink)}
.era .thumb svg.scene{position:absolute;inset:0;width:100%;height:100%}
.era .thumb .mini{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:70%}
.era .body{padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.era h3{font-size:24px;line-height:1.1}
.era .topic{font-weight:700;color:var(--red)}
.era.locked{background:#F4F6F9}
.era.locked .thumb{filter:grayscale(1) opacity(.55)}
.year{font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.link{height:28px;display:flex;align-items:center;justify-content:center}
.link span{width:0;height:100%;border-left:4px dotted var(--ink-soft)}
.lv{display:flex;flex-wrap:wrap;gap:8px}
.lvb{display:inline-flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-display);font-size:15px;background:var(--card);border:2.5px solid var(--ink);border-radius:12px;padding:5px 10px 4px;box-shadow:0 3px 0 var(--ink);cursor:pointer}
.lvb.boss{background:var(--gold)}
.lvb[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.stars{display:inline-flex;gap:1px}
.stars svg{width:15px;height:15px}
@media (max-width:520px){.era{grid-template-columns:1fr}.era .thumb{border-right:0;border-bottom:3px solid var(--ink);min-height:120px}.era .thumb .mini{width:34%}}
.play{display:grid;grid-template-columns:1fr 160px;gap:16px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;flex-direction:column;align-items:center;gap:6px}
.side .say{background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:6px 10px;font-size:15px;text-align:center;line-height:1.3}
.side .pw{width:150px}
.side .nextitem{font-size:14px;font-weight:700;color:var(--ink-soft);text-align:center;line-height:1.3}
@media (max-width:640px){.play{grid-template-columns:1fr}.side{position:static;flex-direction:row;order:-1}.side .pw{width:96px}}
.prog{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.prog .bar{flex:1}
.prog .bar i{background:var(--red)}
.note{position:relative;background-color:var(--card);background-image:linear-gradient(to bottom,transparent 47px,var(--rule) 47px,var(--rule) 48px);background-size:100% 48px;border:3px solid var(--ink);border-radius:18px;padding:8px 18px 18px 44px;line-height:48px;display:flex;flex-direction:column;min-width:0}
.note::before{content:"";position:absolute;left:28px;top:0;bottom:0;width:2px;background:var(--margin)}
.q-prompt{font-family:var(--f-display);color:var(--red);font-size:22px;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.rowlabel{font-family:var(--f-display);color:var(--red);font-size:18px}
.q-src,.q-text{font-size:27px;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:96px;border-bottom:3px solid var(--ink);height:1em;vertical-align:-4px}
.tw{background:var(--mark);border-radius:6px;padding:0 6px;font-weight:700;letter-spacing:.03em}
.cue{color:var(--ink-soft);font-size:22px}
.inl{display:inline-block;font-family:var(--f-body);font-size:24px;line-height:1.2;height:40px;padding:0 8px;border:3px solid var(--ink);border-radius:10px;background:var(--blank);color:var(--ink);vertical-align:middle;max-width:100%}
.inl.ok{border-color:var(--green);background:#E6F8EE}
.inl.no{border-color:var(--red);background:#FFECEE}
.pick{display:inline-flex;flex-wrap:wrap;gap:6px;vertical-align:middle;padding:2px 4px;border:2px dashed var(--ink-soft);border-radius:14px;background:var(--blank);line-height:1.2}
.pk{font-family:var(--f-body);font-weight:700;font-size:20px;border:2.5px solid var(--ink);border-radius:999px;padding:2px 12px;background:var(--card);box-shadow:0 2px 0 var(--ink);cursor:pointer}
.pk.on{background:var(--mark)}
.pk.on.ok{background:#BDEBD2;border-color:var(--green)}
.pk.on.no{background:#FBCFD2;border-color:var(--red)}
.pk[disabled]{cursor:default}
.pm .egg{transform-box:view-box;transform-origin:100px 186px;animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.opts{display:flex;flex-wrap:wrap;gap:12px;padding-block:8px;line-height:1.3}
.opt{flex:1 1 120px;font-weight:700;font-size:24px;background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:8px 14px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt.right{background:#BDEBD2;border-color:var(--green);box-shadow:0 4px 0 var(--green)}
.opt.wrong{background:#FBCFD2;border-color:var(--red);box-shadow:0 4px 0 var(--red);text-decoration:line-through}
.opt[disabled]{cursor:default}
.vt{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1fr);gap:8px 10px;align-items:center;line-height:1.3;padding-top:6px}
.vt .vh{font-family:var(--f-display);color:var(--red);font-size:17px}
.vt .vp{font-size:26px;font-weight:700}
.vt .inl{width:100%}
.actions{display:flex;justify-content:flex-end;padding-top:8px;line-height:1.2}
.fb{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:10px 14px;line-height:1.45;margin-top:8px}
.fb.ok{background:var(--ok-bg);border:2.5px solid var(--green)}
.fb.no{background:var(--no-bg);border:2.5px solid var(--red)}
.fb .tick{width:40px;height:40px;flex:none}
.fb .x{font-family:var(--f-display);font-size:30px;color:var(--red);line-height:1;width:40px;text-align:center;flex:none}
.fb b{font-family:var(--f-display);font-weight:400;font-size:22px}
.fb .fix{font-size:21px}
.fb .goal{font-weight:700;background:#fff;border-radius:6px;padding:0 5px;color:var(--green)}
.fb .hint,.fb .tip{font-size:16px}
.fb .tip{color:#7A5A00}
.result{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.result .bigstars{display:flex;gap:6px}
.result .bigstars svg{width:56px;height:56px}
.score{width:150px;height:150px;border-radius:50%;border:5px solid var(--green);display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);font-family:var(--f-display);font-size:54px;color:var(--green);font-variant-numeric:tabular-nums}
.score.low{border-color:var(--red);color:var(--red)}
.grow{width:100%;max-width:420px;display:flex;flex-direction:column;gap:6px}
.celebrate{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:12px 16px;width:100%;max-width:520px}
.celebrate .pw{width:160px;margin:0 auto}
.closet{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.hat{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:8px;box-shadow:0 3px 0 var(--ink);cursor:pointer;font-size:14px;font-weight:700;text-align:center;line-height:1.2}
.hat svg{width:70px;height:70px}
.hat[aria-pressed="true"]{background:var(--mark)}
.hat[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:24px}
.travel{display:flex;flex-wrap:wrap;gap:10px}
.vedit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:center}
.vedit .inp{font-size:18px;padding:4px 8px}
.vedit .h{font-weight:700;font-size:14px;color:var(--ink-soft)}
.gate{user-select:none;-webkit-user-select:none;touch-action:none}
.gate .fill{display:block;height:6px;background:var(--red);width:0;border-radius:4px;margin-top:6px}
.gate.holding .fill{width:100%;transition:width 1.5s linear}
.pm{display:block;width:100%;height:auto;overflow:visible}
.pg{transform-box:view-box;transform-origin:100px 192px}
.pm.idle .pg{animation:bob 2.6s ease-in-out infinite}
.pm.happy .pg{animation:hop .45s ease-out 2}
.pm.sad .pg{animation:shake .35s ease-in-out 2}
.pm .aura{transform-box:view-box;transform-origin:100px 112px;animation:spin 14s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-24px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.pm .pg,.pm .aura,.pm .egg{animation:none!important}.gate.holding .fill{transition:none}}
</style>
</head>
<body>

<div id="app" class="wrap"></div>

<script>
(() => {
"use strict";
const ICON = "icon-512.png";
/* ---------------- storage ---------------- */
const KEY = "timepets.v1";
const DEFAULT_VERBS = [
  {p:"am",past:"was",pp:"been"},{p:"is",past:"was",pp:"been"},{p:"are",past:"were",pp:"been"},
  {p:"become",past:"became",pp:"become"},{p:"begin",past:"began",pp:"begun"},
  {p:"bite",past:"bit",pp:"bitten"},{p:"bleed",past:"bled",pp:"bled"},{p:"go",past:"went",pp:"gone"}
];
const defaultPlayers = () => [
  {id:"pelonchis", name:"Pelonchis Cacatúa", pet:"Mochi", species:"bear", color:null, xp:0, progress:{}, hats:[], hat:null, era:"dino"},
  {id:"pillus", name:"Pillus Makakikus", pet:"Bubbles", species:"otter", color:null, xp:0, progress:{}, hats:[], hat:null, era:"dino"}
];
function load(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!d || typeof d!=="object") d = {};
  if(d.v!==3 && d.v!==4){ d.players = defaultPlayers(); }
  if(d.v!==4){ (d.players||[]).forEach(p => { p.xp=0; p.progress={}; p.hats=[]; p.hat=null; p.era="dino"; }); d.v = 4; }
  if(!Array.isArray(d.verbs) || !d.verbs.length) d.verbs = DEFAULT_VERBS.map(v=>({...v}));
  if(!d.verbs.some(v => v.p==="go")) d.verbs.push({p:"go",past:"went",pp:"gone"});
  if(d.sound==null) d.sound = true;
  return d;
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
save();
let V = {screen:"home"};
const P = () => S.players.find(p => p.id === V.pid);

/* ---------------- helpers ---------------- */
const R = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hlText = (t, hl) => esc(t).replace(/\[\[(.+?)\]\]/g, (m,x) => hl ? `<span class="tw">${x.toUpperCase()}</span>` : x);
const fmtChoose = (t, hl) => t.split("___").map(x => hlText(x,hl)).join('<span class="blank" aria-label="blank"></span>');
const plain = t => t.replace(/\[\[|\]\]/g,"");

function norm(s){
  s = (s||"").toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.?!,]/g," ").replace(/\s+/g," ").trim();
  const map = [[/\bdon't\b/g,"do not"],[/\bdoesn't\b/g,"does not"],[/\bdidn't\b/g,"did not"],[/\bisn't\b/g,"is not"],[/\baren't\b/g,"are not"],[/\bwasn't\b/g,"was not"],[/\bweren't\b/g,"were not"],[/(^|\s)'m\b/g,"$1am"],[/\bi'm\b/g,"i am"],[/\b(you|we|they)'re\b/g,"$1 are"],[/\b(he|she|it)'s\b/g,"$1 is"]];
  map.forEach(([r,t]) => { s = s.replace(r,t); });
  return s.replace(/\s+/g," ").trim();
}
const fixApos = s => (s||"").replace(/\b(don|doesn|didn|isn|aren|wasn|weren)t\b/gi,"$1't");

/* ---------------- grammar data ---------------- */
const SUBJ = [
  {s:"I",q:"I",t:0,be:"am",was:"was",pro:1,g:"I"},
  {s:"You",q:"you",t:0,be:"are",was:"were",pro:1,g:"You"},
  {s:"He",q:"he",t:1,be:"is",was:"was",pro:1,g:"He"},
  {s:"She",q:"she",t:1,be:"is",was:"was",pro:1,g:"She"},
  {s:"It",q:"it",t:1,be:"is",was:"was",pro:1,an:1,g:"It"},
  {s:"We",q:"we",t:0,be:"are",was:"were",pro:1,g:"We"},
  {s:"They",q:"they",t:0,be:"are",was:"were",pro:1,g:"They"},
  {s:"Cin",q:"Cin",t:1,be:"is",was:"was",g:"She"},
  {s:"Alicia",q:"Alicia",t:1,be:"is",was:"was",g:"She"},
  {s:"Kikona",q:"Kikona",t:1,be:"is",was:"was",g:"She"},
  {s:"Betilio",q:"Betilio",t:1,be:"is",was:"was",g:"He"},
  {s:"Froy",q:"Froy",t:1,be:"is",was:"was",g:"He"},
  {s:"Jorge",q:"Jorge",t:1,be:"is",was:"was",g:"He"},
  {s:"Tina",q:"Tina",t:1,be:"is",was:"was",g:"She"},
  {s:"Fafis",q:"Fafis",t:1,be:"is",was:"was",g:"She"},
  {s:"Grandpa",q:"Grandpa",t:1,be:"is",was:"was",g:"He"},
  {s:"Grandma",q:"Grandma",t:1,be:"is",was:"was",g:"She"},
  {s:"Mom",q:"Mom",t:1,be:"is",was:"was",g:"She"},
  {s:"Dad",q:"Dad",t:1,be:"is",was:"was",g:"He"},
  {s:"Tina and Fafis",q:"Tina and Fafis",t:0,be:"are",was:"were",g:"They"},
  {s:"Grandpa and Grandma",q:"Grandpa and Grandma",t:0,be:"are",was:"were",g:"They"},
  {s:"Cin and Froy",q:"Cin and Froy",t:0,be:"are",was:"were",g:"They"},
  {s:"My school friends",q:"my school friends",t:0,be:"are",was:"were",g:"They"},
  {s:"Tina and I",q:"Tina and I",t:0,be:"are",was:"were",g:"We"},
  {s:"Fafis and I",q:"Fafis and I",t:0,be:"are",was:"were",g:"We"},
  {s:"Mom and I",q:"Mom and I",t:0,be:"are",was:"were",g:"We"},
  {s:"The dog",q:"the dog",t:1,be:"is",was:"was",an:1,g:"It"},
  {s:"The cat",q:"the cat",t:1,be:"is",was:"was",an:1,g:"It"}
];
/* only verbs that appear in the girls' notebook; pz = a past form they have seen; np = past only */
const ACTS = [
  {v:"play",s:"plays",ing:"playing",past:"played",pz:1,o:["soccer with my school friends","the piano for Grandpa","board games with Grandma","in the waves at the beach","tag at recess","video games with Dad"],ao:["with a ball of yarn","in the garden"]},
  {v:"eat",s:"eats",ing:"eating",past:"ate",pz:1,o:["ice cream at the beach","pancakes for breakfast","popcorn at the movies","tacos with Grandpa","a churro at Disney","cake at the birthday party"],ao:["its food","a carrot"]},
  {v:"like",s:"likes",ing:null,past:"liked",pz:0,o:["frappés with whipped cream","strawberry ice cream","the beach","Disney parades","roller coasters","Grandma's cookies"],ao:["warm blankets","belly rubs"]},
  {v:"go",s:"goes",ing:"going",past:"went",pz:1,o:["to Disney with the family","to the beach with Grandma","to school by bus","to the mall with Mom","to the movies with my school friends","to the ice cream shop with Grandpa"],ao:["to the park","under the bed"]},
  {v:"run",s:"runs",ing:"running",past:"ran",pz:0,o:["to the bus stop","around the track","on the beach","in the school race","to hug Grandma"],ao:["after the ball","around the garden"]},

  {v:"brush",s:"brushes",ing:"brushing",past:"brushed",pz:1,o:["the horse at Grandpa's farm","the dog","Grandma's hair"]},
  {v:"study",s:"studies",ing:"studying",past:"studied",pz:1,o:["English for the test","math with Dad","for the spelling quiz","science with my school friends"]},
  {v:"dance",s:"dances",ing:"dancing",past:"danced",pz:1,o:["at the birthday party","in the school show","with Grandpa at the wedding","to music in the living room"]},

  {v:"cook",s:"cooks",ing:"cooking",past:"cooked",pz:1,o:["dinner for Grandpa","pasta with Dad","eggs in the kitchen","pancakes with Mom"]},

  {v:"begin",s:"begins",ing:"beginning",past:"began",pz:1,o:["the homework at four o'clock","a new book","the race","the piano lesson"]}

const T_PRES = ["every day","every Saturday","on Mondays","in the morning","every summer","after school"];
const T_CONT = ["now","right now","at the moment"];
const T_PAST = ["yesterday","last week","last night","last Saturday","last summer","two days ago"];
const ADJ = ["happy at the party","tired after the game","at the beach","excited about the trip to Disney","at Grandpa's house","at the ice cream shop","late for school"];
const THIRD = ["He","She","It"];

/* sentences used in the current lesson, so the same one does not come back */
let USED = new Set(), USEDO = new Set();
function pair(af, f={}){
  for(let k=0;k<120;k++){
    const a = R(ACTS.filter(af || (x => !x.np)));
    let pool = SUBJ.filter(s => s.an ? !!(a.ao && a.ao.length) : a.o.length>0);
    if(f.people) pool = pool.filter(s => !s.an);
    if(f.t!=null) pool = pool.filter(s => s.t===f.t);
    if(!pool.length) continue;
    const groups = [...new Set(pool.map(s => s.g))];
    let g;
    if(f.bias){ const th = groups.filter(x => THIRD.includes(x)), ot = groups.filter(x => !THIRD.includes(x));
      g = (th.length && (Math.random()<.5 || !ot.length)) ? R(th) : R(ot); }
    else g = R(groups);
    const s = R(pool.filter(x => x.g===g));
    const o = s.an ? R(a.ao) : R(a.o);
    const words = s.q.toLowerCase().split(" ").filter(w => w.length>2 && !["and","the"].includes(w));
    if(words.some(w => o.toLowerCase().includes(w))) continue;
    const key = `${s.s}|${a.v}|${o}`;
    if(USED.has(key) || (k<70 && USEDO.has(o))) continue;
    USED.add(key); USEDO.add(o);
    return {a, s, o};
  }
  if(!f._again){ USED.clear(); USEDO.clear(); return pair(af, {...f, _again:1}); }
  return {a:ACTS[0], s:SUBJ[3], o:ACTS[0].o[0]};
}
const pres = (a,s) => s.t ? a.s : a.v;
const presNeg = s => s.t ? "doesn't" : "don't";
const negAlts = n => ({"doesn't":["doesn't","does not"],"don't":["don't","do not"],"didn't":["didn't","did not"],"isn't":["isn't","is not"],"aren't":["aren't","are not"],"am not":["am not"]}[n]);
const contNeg = s => s.be==="am" ? "am not" : s.be==="is" ? "isn't" : "aren't";
const whoIs = s => s.pro ? "" : `${s.s} = ${s.g.toLowerCase()}. `;
/* sentence with the time word at the end, or (sometimes) at the front like "YESTERDAY I cut my finger" */
function sent(s, rest, t, frontChance){
  if(t && Math.random() < (frontChance==null ? .4 : frontChance)) return `[[${cap(t)}]] ${s.q} ${rest}.`;
  return `${s.s} ${rest}${t?` [[${t}]]`:""}.`;
}

const H = {
  third: (a,s) => s.t ? `${whoIs(s)}With he, she, it the verb takes -s: ${a.s}.` : `${whoIs(s)}With I, you, we, they the verb has no -s: ${a.v}.`,
  neg: "Use doesn't with he, she, it. Use don't with I, you, we, they. After don't / doesn't the verb has no -s.",
  q: "Questions start with Do or Does. Does is for he, she, it. After Do / Does the verb has no -s.",
  dodo: "Do and Does start questions. Don't and doesn't make negatives. Does / doesn't are for he, she, it.",
  be: "I → am. He, she, it → is. You, we, they → are.",
  ing: "Present continuous = am / is / are + verb-ing.",
  cneg: "Negative: I am not, he isn't, they aren't + verb-ing.",
  cq: "Questions start with Am, Is or Are, then the verb + ing.",
  past: a => `Yesterday, last week… → simple past: ${a.v} → ${a.past}.`,
  was: "I, he, she, it → was. You, we, they → were.",
  didnt: "After didn't the verb goes back to its normal form: didn't go (not didn't went).",
  did: "Past questions start with Did, and the verb goes back to its normal form: Did he take…?",
  cat: {p:"every day, on Mondays → simple present.", c:"now, right now → present continuous (am / is / are + ing).", x:"yesterday, last week → simple past."},
  pron: {I:"I is for me, the person talking.",You:"You is for the person (or people) I talk to.",He:"He is for one boy or man.",She:"She is for one girl or woman.",It:"It is for one animal or thing.",They:"They is for two or more people, animals or things.",We:"We is for me and other people."}
};

/* question builders */
const Qc = o => ({type:"choose", pts:1, ...o, options: shuffle(o.options)});
const Qw = o => ({type:"write", pts:(o.rows||[]).length, ...o});
const W1 = (prompt, text, alts, hint, cue) => Qw({prompt, rows:[{text, blanks:[alts]}], hint, cue});

/* --- Era 1: pronouns & verb to be --- */
const PRONS = [
  {p:"I",be:"am",clues:["me"]},
  {p:"You",be:"are",clues:["you","you and Alicia"]},
  {p:"He",be:"is",clues:["Betilio","Froy","Jorge","Grandpa","Dad"]},
  {p:"She",be:"is",clues:["Cin","Alicia","Kikona","Tina","Fafis","Grandma","Mom"]},
  {p:"It",be:"is",clues:["the dog","the cat","the frappé","the ice cream","the beach","the castle"],thing:1},
  {p:"We",be:"are",clues:["Tina and I","Fafis and I","Mom and I","my school friends and I"]},
  {p:"They",be:"are",clues:["Tina and Fafis","Grandpa and Grandma","Cin and Froy","Mom and Dad","my school friends"]}
];
const THING_COMP = {"the dog":["very fluffy","hungry","asleep on the sofa"],"the cat":["on the roof","black and white"],"the frappé":["cold and sweet","on the table"],"the ice cream":["delicious","very cold"],"the beach":["sunny today","beautiful"],"the castle":["big and pink","in the middle of the park"]};
const PEOPLE_COMP = ["happy today","at the beach","in the kitchen","very funny","ready for school","excited about the trip to Disney","good at soccer","tired after school","at the ice cream shop","in the pool","on the bus","at Grandma's house"];
const comp = (P, clue) => THING_COMP[clue] ? R(THING_COMP[clue]) : P.thing ? R(["happy","hungry","in the garden"]) : R(PEOPLE_COMP);
const GROUP = {am:["I"], is:["He","She","It"], are:["You","We","They"]};
function pronChoose(){
  const Pn = R(PRONS), clue = R(Pn.clues);
  let opts = GROUP[Pn.be].slice();
  if(opts.length<3) opts = ["I", ...shuffle(["You","He","She","We","They"]).slice(0,2)];
  return Qc({key:"pc"+clue, prompt:"Choose the pronoun.", text:`___ ${Pn.be} ${comp(Pn,clue)}.`, cue:`(${clue})`, options:opts, answers:[Pn.p], show:Pn.p, hint:`${clue} → ${Pn.p}. ${H.pron[Pn.p]}`});
}
function pronWrite(){
  const Pn = R(PRONS), clue = R(Pn.clues);
  return {...W1("Write the pronoun.", `___ ${Pn.be} ${comp(Pn,clue)}.`, [Pn.p], `${clue} → ${Pn.p}. ${H.pron[Pn.p]}`, `(${clue})`), key:"pw"+clue};
}
function beSubj(){
  const Pn = R(PRONS);
  if(Math.random()<.3 && Pn.p!=="I" && Pn.p!=="You"){ const clue = R(Pn.clues); return {Pn, subj:cap(clue), c:comp(Pn,clue), who:`${cap(clue)} = ${Pn.p.toLowerCase()}. `}; }
  return {Pn, subj:Pn.p, c:comp(Pn,""), who:""};
}
function beChoose(){
  const {Pn,subj,c,who} = beSubj();
  return Qc({key:"bc"+subj+c, prompt:"Choose am, is or are.", text:`${subj} ___ ${c}.`, options:["am","is","are"], answers:[Pn.be], show:Pn.be, hint:who+H.be});
}
function beWrite(){
  const {Pn,subj,c,who} = beSubj();
  return {...W1("Write am, is or are.", `${subj} ___ ${c}.`, [Pn.be], who+H.be), key:"bw"+subj+c};
}
function beGrid(){
  const c = R(["happy","ready","hungry","at the beach","excited"]);
  const rows = PRONS.map(Pn => ({text:`${Pn.p} ___ ${c}.`, blanks:[[Pn.be]]}));
  return Qw({key:"grid", prompt:"Put the verb to be with each pronoun.", rows, hint:H.be});
}

/* --- Era 2: simple present --- */
function presChoose(){
  const {a,s,o} = pair(null,{bias:1}); const t = R(T_PRES);
  return Qc({prompt:"Choose the correct verb.", text:sent(s, `___ ${o}`, t), options:[a.v, a.s, a.ing||a.past], answers:[pres(a,s)], show:pres(a,s), hint:H.third(a,s)});
}
function doChoose(){
  const {a,s,o} = pair(null,{bias:1});
  const opts = ["Do","Does","don't","doesn't"];
  if(Math.random()<.5) return Qc({prompt:"Choose Do, Does, don't or doesn't.", text:`___ ${s.q} ${a.v} ${o}?`, options:opts, answers:[s.t?"Does":"Do"], show:s.t?"Does":"Do", hint:whoIs(s)+H.q});
  const t = Math.random()<.5 ? R(T_PRES) : null;
  return Qc({prompt:"Choose Do, Does, don't or doesn't.", text:sent(s, `___ ${a.v} ${o}`, t), options:opts, answers:[presNeg(s)], show:presNeg(s), hint:whoIs(s)+H.neg});
}
function presWrite(){
  const {a,s,o} = pair(null,{bias:1}); const r = Math.random();
  if(r<.6) return W1("Complete with the correct form of the verb.", sent(s, `___ ${o}`, R(T_PRES)), [pres(a,s)], H.third(a,s), `(${a.v})`);
  if(r<.8) return W1("Complete with the verb.", `${s.s} ${presNeg(s)} ___ ${o}.`, [a.v], "After don't / doesn't the verb has no -s.", `(${a.v})`);
  return W1("Complete with the verb.", `${s.t?"Does":"Do"} ${s.q} ___ ${o}?`, [a.v], "After Do / Does the verb has no -s.", `(${a.v})`);
}
function presFlip(){
  const {a,s,o} = pair(null,{bias:1});
  const n = presNeg(s);
  return Qw({prompt:"Make it negative and interrogative.", source:`${s.s} ${pres(a,s)} ${o}.`, rows:[
    {label:"Negative", text:`${s.s} ___ ___ ${o}.`, blanks:[negAlts(n),[a.v]], picks:{0:["don't","doesn't"]}},
    {label:"Interrogative", text:`___ ${s.q} ___ ${o}?`, blanks:[[s.t?"Does":"Do"],[a.v]], picks:{0:["Do","Does"]}}
  ], hint:whoIs(s)+H.neg+" "+H.q});
}

/* --- Era 3: present continuous --- */
const hasIng = a => !!a.ing;
function contChoose(){
  const r = Math.random(); const {a,s,o} = pair(hasIng); const t = R(T_CONT);
  if(r<.35) return Qc({prompt:"Choose am, is or are.", text:sent(s, `___ ${a.ing} ${o}`, t), options:["am","is","are"], answers:[s.be], show:s.be, hint:whoIs(s)+H.be});
  if(r<.6) return Qc({prompt:"Choose the correct verb.", text:sent(s, `${s.be} ___ ${o}`, t), options:[a.v,a.s,a.ing], answers:[a.ing], show:a.ing, hint:H.ing});
  if(r<.8) return Qc({prompt:"Choose the correct word.", text:`___ ${s.q} ${a.ing} ${o}?`, options:["Am","Is","Are"], answers:[cap(s.be)], show:cap(s.be), hint:whoIs(s)+H.cq});
  const opts = s.be==="am" ? ["am not","isn't","don't"] : s.be==="is" ? ["isn't","aren't","doesn't"] : ["aren't","isn't","don't"];
  return Qc({prompt:"Choose the correct word.", text:`${s.s} ___ ${a.ing} ${o}.`, options:opts, answers:[contNeg(s)], show:contNeg(s), hint:whoIs(s)+H.cneg});
}
function contWrite(){
  const {a,s,o} = pair(hasIng); const r = Math.random();
  if(r<.5) return Qw({prompt:"Complete with am, is or are + verb-ing.", rows:[{text:sent(s, `___ ___ ${o}`, R(T_CONT)), blanks:[[s.be],[a.ing]]}], hint:whoIs(s)+H.ing, cue:`(${a.v})`});
  if(r<.75) return W1("Write the verb + ing.", sent(s, `${s.be} ___ ${o}`, R(T_CONT)), [a.ing], H.ing, `(${a.v})`);
  return W1("Write am, is or are.", sent(s, `___ ${a.ing} ${o}`, R(T_CONT)), [s.be], whoIs(s)+H.be);
}
function contFlip(){
  const {a,s,o} = pair(hasIng);
  return Qw({prompt:"Make it negative and interrogative.", source:`${s.s} ${s.be} ${a.ing} ${o}.`, rows:[
    {label:"Negative", text:`${s.s} ___ ${a.ing} ${o}.`, blanks:[negAlts(contNeg(s))], picks:{0:["am not","isn't","aren't"]}},
    {label:"Interrogative", text:`___ ${s.q} ${a.ing} ${o}?`, blanks:[[cap(s.be)]], picks:{0:["Am","Is","Are"]}}
  ], hint:whoIs(s)+H.cneg+" "+H.cq});
}

/* --- Era 4: verb forms (editable list) --- */
const KNOWN_ING = {begin:"beginning",bite:"biting",bleed:"bleeding",become:"becoming",go:"going",take:"taking",eat:"eating",run:"running",swim:"swimming",write:"writing",come:"coming",get:"getting",sit:"sitting",make:"making"};
const ingOf = p => KNOWN_ING[p] || (/[^e]e$/.test(p) ? p.slice(0,-1)+"ing" : p+"ing");
function verbOpts(v, which){
  const ans = v[which];
  let c = ["am","is","are"].includes(v.p) ? ["was","were","been","being"] : [v.p, v.past, v.pp, ingOf(v.p)];
  c = [...new Set(c)].filter(x => x!==ans);
  return [ans, ...shuffle(c).slice(0,2)];
}
const vHint = v => `${v.p} → ${v.past} → ${v.pp}`;
function vChoose(w){
  const v = R(S.verbs), which = w || R(["past","pp"]);
  return Qc({key:"vc"+which+v.p, prompt: which==="past" ? `Circle the past of “${v.p}”.` : `Circle the past participle of “${v.p}”.`, text:`${v.p} → ___`, options:verbOpts(v,which), answers:[v[which]], show:v[which], hint:vHint(v)});
}
function vTable(){
  const v = R(S.verbs);
  return Qw({key:"vt"+v.p, prompt:"Complete the table: past and past participle.", rows:[
    {label:"Past", text:`${v.p} → ___`, blanks:[[v.past]], picks:{0:shuffle(verbOpts(v,"past"))}},
    {label:"Past participle", text:`${v.p} → ${v.past} → ___`, blanks:[[v.pp]], picks:{0:shuffle(verbOpts(v,"pp"))}}
  ], hint:vHint(v)});
}

  if(r<.8) return W1("Complete with the verb.", sent(s, `didn't ___ ${o}`, t), [a.v], H.didnt, `(${a.v})`);
  const {s:s2} = pair(null,{people:1});
  return W1("Write was or were.", sent(s2, `___ ${R(ADJ)}`, t), [s2.was], whoIs(s2)+H.was);
}
function pastFlip(){
  const {a,s,o} = pair(isPz); const t = R(T_PAST);
  return Qw({prompt:"Make it negative and interrogative.", source:`${s.s} ${a.past} ${o} [[${t}]].`, rows:[
    {label:"Negative", text:`${s.s} ___ ___ ${o} [[${t}]].`, blanks:[negAlts("didn't"),[a.v]], picks:{0:["didn't","don't","doesn't"]}},
    {label:"Interrogative", text:`___ ${s.q} ___ ${o} [[${t}]]?`, blanks:[["Did"],[a.v]], picks:{0:["Did","Do","Does"]}}

/* --- Era 6: time mix --- */
const mixAct = a => a.pz && a.ing;
function mixParts(){
  const {a,s,o} = pair(mixAct,{bias:1}); const c = R(["p","c","x"]);
  const t = c==="p" ? R(T_PRES) : c==="c" ? R(T_CONT) : R(T_PAST);
  return {a,s,o,c,t,forms:{p:pres(a,s), c:`${s.be} ${a.ing}`, x:a.past}};
}
function mixChoose(){
  const {s,o,c,t,forms} = mixParts();
  return Qc({prompt:"Look at the time words. Circle the verb.", text:sent(s, `___ ${o}`, t), options:[forms.p,forms.c,forms.x], answers:[forms[c]], show:forms[c], hint:whoIs(s)+H.cat[c]});
}

  const {a,s,o,c,t,forms} = mixParts();
  if(c==="c") return Qw({prompt:"Look at the time words. Write the verb.", rows:[{text:sent(s, `___ ___ ${o}`, t), blanks:[[s.be],[a.ing]]}], hint:whoIs(s)+H.cat[c], cue:`(${a.v})`});
  return W1("Look at the time words. Write the verb.", sent(s, `___ ${o}`, t), [forms[c]], whoIs(s)+H.cat[c], `(${a.v})`);
}
const FIXERS = [
  () => { const {a,s,o}=pair(null,{t:1}); const t=R(T_PRES); return [`${s.s} ${a.v} ${o} [[${t}]].`, `${s.s} ___ ${o} [[${t}]].`, [a.s], whoIs(s)+"With he, she, it the verb takes -s."]; },
  () => { const {a,s,o}=pair(null,{t:1}); return [`${s.s} don't ${a.v} ${o}.`, `${s.s} ___ ${a.v} ${o}.`, negAlts("doesn't"), whoIs(s)+"Use doesn't with he, she, it.", ["don't","doesn't"]]; },
  () => { const {a,s,o}=pair(null,{t:0}); return [`${s.s} doesn't ${a.v} ${o}.`, `${s.s} ___ ${a.v} ${o}.`, negAlts("don't"), whoIs(s)+"Use don't with I, you, we, they.", ["don't","doesn't"]]; },

function pastConj(){

let actx = null;
function tone(fs){
  if(!S.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t0 = actx.currentTime;
    fs.forEach((f,i) => { const o=actx.createOscillator(), g=actx.createGain(); o.type="triangle"; o.frequency.value=f; const st=t0+i*.1;
      g.gain.setValueAtTime(.0001,st); g.gain.exponentialRampToValueAtTime(.16,st+.02); g.gain.exponentialRampToValueAtTime(.0001,st+.28);
      o.connect(g); g.connect(actx.destination); o.start(st); o.stop(st+.3); });
  }catch(e){}
}

function focusInput(){ const i = app.querySelector(".inl"); if(i && !V.fb) try{ i.focus({preventScroll:true}); }catch(e){} }

const ac = 'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next"';
function rowHTML(r, ri, hl, fb){
  const parts = r.text.split("___");
  let h = "";
  parts.forEach((part,k) => {
    h += hlText(part, hl);
    if(k < parts.length-1 && r.picks && r.picks[k]){

    } else if(k < parts.length-1){
      const alts = r.blanks[k]; const w = Math.max(6, ...alts.map(a=>a.length)) + 2;
      const val = fb ? fb.vals[ri][k] : ""; const cls = fb ? (fb.rows[ri].cells[k] ? "ok" : "no") : "";

    }
  });
  return h;
}
const fixedHTML = (r, hl) => { const parts = r.text.split("___"); return parts.map((p,k) => hlText(p,hl) + (k<parts.length-1 ? `<span class="goal">${esc(r.blanks[k][0])}</span>` : "")).join(""); };

  } else {

    h += `<div class="vt"><div class="vh">Present</div><div class="vh">Past</div><div class="vh">Past Participle</div><div class="vp">${esc(q.v.p)}</div><input class="inl ${c1}" id="t0" ${ac} ${fb?"readonly":""} value="${fb?esc(fb.vals[0]):""}" aria-label="Past"><input class="inl ${c2}" id="t1" ${ac} ${fb?"readonly":""} value="${fb?esc(fb.vals[1]):""}" aria-label="Past participle"></div>`;

      else ans = q.rows.map((r,ri) => fb.rows[ri].ok ? "" : `<div class="fix">${fixedHTML(r,hl)}</div>`).join("");

const PRAISE = ["Correct!","Great job!","Yes!","Perfect!","You got it!","Super!"];
const PET_OK = ["Yay! I grew a little!","Correct! Hug time!","Yum, crystals!","You are a time star!","Wow!"];
const PET_NO = ["Oops! Let's look.","Almost! Read the hint.","We can fix this!","Look at the answer."];

function evaluate(q, vals){
  if(q.type==="choose"){ const ok = vals===q.answers[0]; return {ok, pick:vals, gain:ok?1:0, pts:ok?1:0}; }
  if(q.type==="table"){
    const cells = [norm(vals[0])===norm(q.v.past), norm(vals[1])===norm(q.v.pp)];
    const n = cells.filter(Boolean).length;
    return {ok:n===2, cells, vals, gain:n, pts:n};
  }
  let apos = false; const tips = new Set();
  const rows = q.rows.map((r,ri) => {
    const cells = r.blanks.map((alts,k) => {
      const v = vals[ri][k] || "";
      const ok = alts.some(a => norm(a)===norm(v));
      if(!ok && v.trim() && alts.some(a => norm(a)===norm(fixApos(v)))) apos = true;
      if(ok && k===0 && r.text.startsWith("___") && /^[a-z]/.test(v.trim())) tips.add("Remember: a sentence starts with a capital letter.");
      return ok;
    });
    return {ok:cells.every(Boolean), cells};
  });
  const n = rows.filter(r => r.ok).length;
  return {ok:n===rows.length, rows, vals, gain:n*2, pts:n, apos, tip:[...tips].join(" ")};
}

function readVals(q){
  if(q.type==="table") return [document.getElementById("t0").value, document.getElementById("t1").value];
  return q.rows.map((r,ri) => r.blanks.map((_,k) => { if(r.picks && r.picks[k]) return V.picks[`${ri}_${k}`] || ""; const el = document.getElementById(`b${ri}_${k}`); return el ? el.value : ""; }));
}

function doCheck(vals){
  const s = V.sess, q = s.qs[s.i], p = P();
  if(V.fb) return;
  if(q.type!=="choose" && vals.flat().every(v => !v.trim())){ V.say = "Write your answer first!"; render(); focusInput(); return; }
  const r = evaluate(q, vals);
  const gain = q.retry ? Math.min(r.gain,1) : r.gain;
  if(!q.retry) s.points += r.pts;
  p.xp += gain; s.gems += gain; save();
  const again = !r.ok && !s.boss && !q.retry;
  if(again) s.qs.push({...q, retry:true, options: q.options ? shuffle(q.options) : undefined});
  const partial = r.pts>0 && !r.ok;
  V.fb = {...r, gain, hint: r.apos ? `Remember the apostrophe ( ' ). ${q.hint}` : q.hint, praise:R(PRAISE), title: r.apos ? "So close!" : partial ? "Half right!" : "Not quite!", again};
  V.mood = r.ok ? "happy" : "sad"; V.say = r.ok ? R(PET_OK) : R(PET_NO);
  tone(r.ok ? [660,880] : [300,220]);
  render();
  const n = document.getElementById("next"); if(n) try{ n.focus({preventScroll:true}); }catch(e){}
}

function nextQ(){
  const s = V.sess; s.i++; V.fb = null; V.picks = {}; V.mood = "idle"; V.say = R(["Next one!","You can do it!","Ready?","Let's go!"]);
  if(s.i >= s.qs.length) return finish();
  render(); focusInput();
}

function finish(){
  const s = V.sess, p = P(), e = ERAS[s.ei], pr = prog(p, e.id);
  const before = s.startN;
  const res = {ei:s.ei, l:s.l, boss:s.boss, points:s.points, max:s.max, gems:s.gems};
  if(!s.boss){
    const pct = s.points/s.max; const st = pct>=.9?3:pct>=.7?2:pct>=.5?1:0;
    res.stars = st; pr.l[s.l] = Math.max(pr.l[s.l]||0, st);
  } else {
    const score = Math.round(s.points/s.max*10);
    res.score = score; res.pass = score>=7;
    const first = pr.boss < 7;
    pr.boss = Math.max(pr.boss, score);
    if(res.pass && first){
      p.xp += 10; res.gems += 10; res.bonus = true;
      p.hats = p.hats || []; if(!p.hats.includes(e.hat)) p.hats.push(e.hat);
      res.hat = e.hat;
      const nx = ERAS[s.ei+1]; if(nx){ p.era = nx.id; res.next = nx; }
    }
  }
  const after = growthN(p);
  res.grew = after > before; res.stage = STAGES[stageOf(p)][0]; res.hatched = before===0 && res.grew;
  res.items = ITEMS.filter(i => i.n>before && i.n<=after && i.id!=="hatch").map(i => i.name);
  save(); V.res = res; V.screen = "result";
  tone(res.grew || res.pass || res.stars>=2 ? [523,659,784,1046] : [440,523]);
  render(); window.scrollTo(0,0);
}

function resultHTML(){
  const p = P(), r = V.res;
  let main;
  if(!r.boss){
    const msg = r.stars===3 ? "Amazing!" : r.stars===2 ? "Great work!" : r.stars===1 ? "Good job!" : "Keep practicing!";
    main = `<h2 style="font-size:34px">${msg}</h2><div class="bigstars">${star(r.stars>=1)}${star(r.stars>=2)}${star(r.stars>=3)}</div><div>You got <b>${r.points}</b> of <b>${r.max}</b> points the first time.</div>${r.stars===0?'<div class="muted">You need 1 star to open the next level.</div>':""}`;
  } else {
    main = `<h2 style="font-size:34px">${r.pass?"You passed the Time Quiz!":"Time Quiz"}</h2><div class="score ${r.pass?"":"low"}">${r.score}/10</div>${r.pass?"":'<div>You need 7 to travel. Practice the levels and try again!</div>'}`;
  }
  let celeb = "";
  if(r.hat) celeb += `<div class="celebrate"><h3 style="font-size:22px">New hat: ${ERAS.find(x=>x.hat===r.hat).hatName}!</h3>${r.next?`<div>${esc(p.pet)} traveled to <b>${r.next.name}</b> (${r.next.year}). New lessons: ${r.next.topic}.</div>`:`<div>You finished every time! ${esc(p.pet)} is a real time traveler.</div>`}</div>`;
  if(r.hatched) celeb += `<div class="celebrate"><h3 style="font-size:26px">Crack! The egg hatched!</h3><div style="font-size:20px">Surprise! ${esc(p.pet)} is a little ${p.species==="otter"?"otter":"bear"}!</div><div class="pw">${petSVG(p,"happy")}</div></div>`;
  else if(r.grew) celeb += `<div class="celebrate"><h3 style="font-size:22px">${esc(p.pet)} grew${r.items.length?` and got ${r.items.join(" and ")}`:""}!</h3><div class="pw">${petSVG(p,"happy")}</div></div>`;
  return topBar(p) + `<div class="result">${main}<div class="chip" style="font-size:20px">${GEM}+${r.gems} time crystals${r.bonus?" (10 bonus)":""}</div>${celeb}
  ${r.grew?"":`<div style="width:160px">${petSVG(p,"happy")}</div>`}
  <div class="grow">${growBar(p)}</div>
  <div class="row" style="justify-content:center"><button class="btn white" data-act="play" data-e="${r.ei}" data-l="${r.l}">${r.boss?"Try again":"Play again"}</button><button class="btn" data-act="map">Time map</button></div></div>`;
}

/* ---------- grown-ups ---------- */
function grownHTML(){
  if(!V.grownOpen) return `<div class="row"><button class="btn small white" data-act="home">Back</button></div>
    <div class="panel"><h2>Grown-ups</h2><div>Press and hold the button for 2 seconds to open the settings.</div><div><button class="btn white gate" id="gate">Hold to open<span class="fill"></span></button></div></div>`;
  const rows = S.verbs.map((v,i) => `<input class="inp" data-vi="${i}" data-f="p" value="${esc(v.p)}" aria-label="Present ${i+1}"><input class="inp" data-vi="${i}" data-f="past" value="${esc(v.past)}" aria-label="Past ${i+1}"><input class="inp" data-vi="${i}" data-f="pp" value="${esc(v.pp)}" aria-label="Past participle ${i+1}"><button class="btn small white" data-act="vdel" data-i="${i}" aria-label="Delete ${esc(v.p)}">Delete</button>`).join("");
  const players = S.players.map(p => `<div class="row" style="justify-content:space-between"><span><b>${esc(p.name)}</b> · ${esc(p.pet)} · ${p.xp} crystals</span><button class="btn small white" data-act="preset" data-id="${p.id}">${V.arm==="r"+p.id?"Tap again to reset":"Reset progress"}</button></div>`).join("");
  const na = 'autocapitalize="off" autocorrect="off" spellcheck="false"';
  return `<div class="row"><button class="btn small white" data-act="home">Back</button></div>
  <div class="panel"><h2>Verb list (Pirate Cove)</h2><div class="muted">Add the verbs from the notebook each week. Changes save as you type.</div>
  <div class="vedit"><span class="h">Present</span><span class="h">Past</span><span class="h">Past participle</span><span></span>${rows}
  <input class="inp" id="nv-p" placeholder="take" ${na} aria-label="New present"><input class="inp" id="nv-past" placeholder="took" ${na} aria-label="New past"><input class="inp" id="nv-pp" placeholder="taken" ${na} aria-label="New past participle"><button class="btn small" data-act="vadd">Add</button></div>
  <div class="row"><button class="btn small white" data-act="vreset">${V.arm==="v"?"Tap again to restore":"Restore notebook list"}</button><span class="muted" id="v-msg"></span></div></div>
  <div class="panel"><h2>Players</h2>${players}</div>`;
}

/* ---------- render & events ---------- */
function render(){
  const map = {home:homeHTML, color:colorHTML, map:mapHTML, room:roomHTML, play:playHTML, result:resultHTML, grown:grownHTML};
  if(["map","room","play","result","color"].includes(V.screen) && !P()) V.screen = "home";
  app.innerHTML = (map[V.screen]||homeHTML)();
  if(V.screen==="grown" && !V.grownOpen) bindGate();
}
function bindGate(){
  const g = document.getElementById("gate"); if(!g) return; let tm = null;
  const start = ev => { ev.preventDefault(); g.classList.add("holding"); tm = setTimeout(() => { V.grownOpen = true; render(); }, 1500); };
  const stop = () => { g.classList.remove("holding"); clearTimeout(tm); };
  g.addEventListener("pointerdown", start); ["pointerup","pointerleave","pointercancel"].forEach(t => g.addEventListener(t, stop));
}
function go(screen){ V.screen = screen; V.arm = null; render(); window.scrollTo(0,0); }

const ACT = {
  home(){ V.pid = null; V.grownOpen = false; go("home"); },
  pick(el){ V.pid = el.dataset.id; V.pick = null; go(P().color ? "map" : "color"); },
  recolor(){ V.pick = null; go("color"); },
  col(el){ const p = P(); V.pick = {color:el.dataset.c, pet:document.getElementById("pk-pet").value};
    app.querySelectorAll(".sw").forEach(b => b.setAttribute("aria-pressed", b.dataset.c===V.pick.color));
    document.getElementById("pk-prev").innerHTML = petSVG({...p, color:V.pick.color}, isEgg(p)?"idle":"happy"); },
  savecol(){ const p = P(); const pet = document.getElementById("pk-pet").value.trim();
    p.color = (V.pick && V.pick.color) || p.color || "mint"; if(pet) p.pet = pet; save(); go("map"); },
  map(){ V.fb = null; go("map"); },
  room(){ V.roomSay = null; V.roomMood = "idle"; go("room"); },
  sound(){ S.sound = !S.sound; save(); render(); },
  play(el){ startLevel(+el.dataset.e, +el.dataset.l); window.scrollTo(0,0); },
  opt(el){ doCheck(el.dataset.v); },
  pk(el){ V.picks[el.dataset.b] = el.dataset.v;
    el.parentNode.querySelectorAll(".pk").forEach(b => { const on = b===el; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); }); },
  check(){ doCheck(readVals(V.sess.qs[V.sess.i])); },
  next(){ nextQ(); },
  hat(el){ const p = P(); p.hat = el.dataset.h || null; save(); V.roomMood = "happy"; V.roomSay = p.hat ? "I love my new hat!" : "No hat today."; render(); },
  travel(el){ const p = P(); p.era = el.dataset.e; save(); const e = ERAS.find(x => x.id===p.era); V.roomMood = "happy"; V.roomSay = `Whoosh! We are in ${e.name}, ${e.year}!`; tone([392,523,659]); render(); },
  grown(){ V.grownOpen = false; go("grown"); },
  vdel(el){ S.verbs.splice(+el.dataset.i,1); if(!S.verbs.length) S.verbs = DEFAULT_VERBS.map(v=>({...v})); save(); render(); },
  vadd(){ const a = document.getElementById("nv-p").value.trim().toLowerCase(), b = document.getElementById("nv-past").value.trim().toLowerCase(), c = document.getElementById("nv-pp").value.trim().toLowerCase();
    if(!a||!b||!c){ document.getElementById("v-msg").textContent = "Fill in all three forms."; return; }
    S.verbs.push({p:a,past:b,pp:c}); save(); render(); },
  vreset(){ if(V.arm!=="v"){ V.arm = "v"; render(); return; } S.verbs = DEFAULT_VERBS.map(v=>({...v})); save(); V.arm = null; render(); },
  preset(el){ const k = "r"+el.dataset.id; if(V.arm!==k){ V.arm = k; render(); return; } const p = S.players.find(x => x.id===el.dataset.id); if(p){ p.xp=0; p.progress={}; p.hats=[]; p.hat=null; p.era="dino"; } save(); V.arm = null; render(); }
};

app.addEventListener("click", ev => { const el = ev.target.closest("[data-act]"); if(!el || el.disabled) return; const f = ACT[el.dataset.act]; if(f) f(el); });
app.addEventListener("keydown", ev => {
  if(ev.key!=="Enter" || !ev.target.classList || !ev.target.classList.contains("inl")) return;
  ev.preventDefault();
  if(V.fb){ nextQ(); return; }
  const all = [...app.querySelectorAll(".inl")]; const i = all.indexOf(ev.target);
  if(i>=0 && i<all.length-1){ all[i+1].focus(); return; }
  ACT.check();
});
app.addEventListener("input", ev => {
  const t = ev.target; if(t.dataset && t.dataset.vi!=null){ const v = S.verbs[+t.dataset.vi]; if(v){ v[t.dataset.f] = t.value.trim().toLowerCase(); save(); } }
});

render();
})();
</script>
