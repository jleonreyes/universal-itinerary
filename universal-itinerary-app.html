<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/jleonreyes/universal-itinerary/main/icon-192x192.png">
    <meta name="theme-color" content="#1e3a8a">
    <title>Universal Orlando Itinerario</title>
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Universal%20Orlando%20Itinerario%22,%22short_name%22:%22Universal%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%230f172a%22,%22theme_color%22:%22%231e3a8a%22,%22orientation%22:%22portrait%22}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            overflow-x: hidden;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }

        .container {
            max-width: 100%;
            padding: 16px max(16px, env(safe-area-inset-left));
            padding-right: max(16px, env(safe-area-inset-right));
        }

        header {
            margin-bottom: 24px;
            padding-top: max(16px, env(safe-area-inset-top));
        }

        .countdown {
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            text-align: center;
        }

        .countdown-label {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .countdown-value {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .day-selector {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 24px;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 8px;
        }

        .day-btn {
            flex-shrink: 0;
            padding: 8px 12px;
            border: 2px solid #334155;
            border-radius: 8px;
            background: transparent;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .day-btn.active {
            border-color: #3b82f6;
            background: #1e40af;
            color: #fff;
        }

        .day-btn:active {
            transform: scale(0.95);
        }

        .timeline-container {
            background: #1e293b;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            overflow-y: auto;
            max-height: 60vh;
            border: 1px solid #334155;
            -webkit-overflow-scrolling: touch;
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 600px;
            position: relative;
        }

        .time-slot {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 8px;
            min-height: 80px;
            border-radius: 8px;
            background: #0f172a;
            border: 2px dashed #334155;
            transition: all 0.2s;
        }

        .time-slot.drag-over {
            background: #1e40af;
            border-color: #3b82f6;
            transform: scale(1.02);
        }

        .time-label {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            min-width: 50px;
            text-align: right;
            padding-top: 4px;
        }

        .slot-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .attraction-in-slot {
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 13px;
            color: #fff;
            cursor: grab;
            border: 1px solid rgba(255,255,255,0.2);
            user-select: none;
            -webkit-user-select: none;
            gap: 8px;
        }

        .attraction-in-slot:active {
            cursor: grabbing;
            opacity: 0.7;
        }

        .attraction-name {
            flex: 1;
        }

        .attraction-meta {
            font-size: 11px;
            color: rgba(255,255,255,0.8);
            line-height: 1.3;
        }

        .remove-btn {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.8);
            cursor: pointer;
            font-size: 16px;
            padding: 0;
            flex-shrink: 0;
        }

        .attractions-panel {
            background: #1e293b;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            border: 1px solid #334155;
        }

        .attractions-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #f1f5f9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .park-section {
            margin-bottom: 16px;
        }

        .park-name {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .attractions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
        }

        .attraction-btn {
            padding: 10px 8px;
            background: #334155;
            border: 2px solid;
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            transition: all 0.2s;
            text-align: center;
            word-break: break-word;
        }

        .attraction-btn:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        /* Colores por zona/mundo */
        .btn-nintendo { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }
        .btn-dark { border-color: #6b21a8; background: rgba(107, 33, 168, 0.2); }
        .btn-berk { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); }
        .btn-celestial { border-color: #eab308; background: rgba(234, 179, 8, 0.2); }
        .btn-harrypotter { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); }
        .btn-marvel { border-color: #ec4899; background: rgba(236, 72, 153, 0.2); }
        .btn-jurassic { border-color: #92400e; background: rgba(146, 64, 14, 0.2); }
        .btn-illumination { border-color: #f97316; background: rgba(249, 115, 22, 0.2); }
        .btn-seuss { border-color: #d946ef; background: rgba(217, 70, 239, 0.2); }

        .slot-nintendo { background: rgba(239, 68, 68, 0.15); }
        .slot-dark { background: rgba(107, 33, 168, 0.15); }
        .slot-berk { background: rgba(34, 197, 94, 0.15); }
        .slot-celestial { background: rgba(234, 179, 8, 0.15); }
        .slot-harrypotter { background: rgba(59, 130, 246, 0.15); }
        .slot-marvel { background: rgba(236, 72, 153, 0.15); }
        .slot-jurassic { background: rgba(146, 64, 14, 0.15); }
        .slot-illumination { background: rgba(249, 115, 22, 0.15); }
        .slot-seuss { background: rgba(217, 70, 239, 0.15); }

        .suggestions {
            background: #1e40af;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #60a5fa;
        }

        .suggestions-title {
            font-size: 12px;
            font-weight: 700;
            color: #93c5fd;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .suggestion-item {
            font-size: 12px;
            color: #e0e7ff;
            margin-bottom: 6px;
            padding-left: 8px;
            border-left: 2px solid #60a5fa;
            line-height: 1.4;
        }

        .suggestion-item:last-child {
            margin-bottom: 0;
        }

        .stats {
            background: #1e293b;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 12px;
            border: 1px solid #334155;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-weight: 700;
            color: #60a5fa;
            font-size: 16px;
        }

        .stat-label {
            color: #64748b;
            font-size: 11px;
            margin-top: 4px;
        }

        @media (max-height: 667px) {
            .timeline-container {
                max-height: 50vh;
            }
        }
    </style>
</head>
<body>

                { id: 'honeydukes', name: 'Honeydukes (Comida)', duration: 30, park: 'IOA', zone: 'harrypotter' },
                { id: 'ollivanders', name: 'Ollivanders (Tienda)', duration: 20, park: 'IOA', zone: 'harrypotter' },
                { id: 'knock', name: 'Knock Turn Alley (Tienda)', duration: 15, park: 'IOA', zone: 'harrypotter' },
                { id: 'celestina', name: 'Celestina Warbeck (Tienda)', duration: 15, park: 'IOA', zone: 'harrypotter' },
                { id: 'beedle', name: 'Beedle the Bard (Tienda)', duration: 15, park: 'IOA', zone: 'harrypotter' }
            ],
            'IOA - Marvel Super Hero Island': [
                { id: 'spiderman', name: 'Spider-Man Adventure', duration: 4, park: 'IOA', zone: 'marvel' },
                { id: 'hulk', name: 'The Incredible Hulk Coaster', duration: 3, park: 'IOA', zone: 'marvel' },
                { id: 'doom', name: 'Doctor Doom\'s Fearfall', duration: 3, park: 'IOA', zone: 'marvel' }
            ],
            'IOA - Skull Island': [
                { id: 'skull', name: 'Skull Island: Reign of Kong', duration: 4, park: 'IOA', zone: 'marvel' }
            ],
            'IOA - Jurassic Park': [
                { id: 'velocicoaster', name: 'VelociCoaster', duration: 3, park: 'IOA', zone: 'jurassic' },
                { id: 'pteranodon', name: 'Pteranodon Flyers', duration: 4, park: 'IOA', zone: 'jurassic' },
                { id: 'river', name: 'Jurassic Park River Adventure', duration: 4, park: 'IOA', zone: 'jurassic' }
            ],
            'USF - Diagon Alley': [
                { id: 'gringotts', name: 'Harry Potter and the Escape from Gringotts', duration: 5, park: 'USF', zone: 'harrypotter' },
                { id: 'express_kc', name: 'Hogwarts Express (Kings Cross)', duration: 9, park: 'USF', zone: 'harrypotter' },
                { id: 'florean', name: 'Florean Fortescue (Comida)', duration: 30, park: 'USF', zone: 'harrypotter' }
            ],
            'USF - New York': [
                { id: 'mummy', name: 'Revenge of the Mummy', duration: 4, park: 'USF', zone: 'dark' }
            ],
            'USF - Hollywood': [
                { id: 'et', name: 'E.T. Adventure', duration: 4, park: 'USF', zone: 'illumination' },
                { id: 'bourne', name: 'The Bourne Stuntacular (Show)', duration: 20, park: 'USF', zone: 'illumination' }
            ],
            'USF - Minion Land': [
                { id: 'despicable', name: 'Despicable Me Minion Mayhem', duration: 4, park: 'USF', zone: 'illumination' },
                { id: 'villain', name: 'Illumination\'s Villain-Con Minion Blast', duration: 4, park: 'USF', zone: 'illumination' }
            ],
            'USF - World Expo': [
                { id: 'mib', name: 'Men in Black: Alien Attack', duration: 4, park: 'USF', zone: 'illumination' }
            ],
            'USF - Production Central': [
                { id: 'transformers', name: 'Transformers: The Ride 3D', duration: 4, park: 'USF', zone: 'illumination' }
            ]
        };

        const waitTimes = {
            battle: { 9: 110, 10: 120, 11: 95, 12: 80, 13: 75, 14: 85, 15: 90, 16: 100, 17: 95, 18: 80, 19: 60, 20: 40 },
            minecart: { 9: 120, 10: 110, 11: 100, 12: 90, 13: 85, 14: 95, 15: 105, 16: 110, 17: 100, 18: 85, 19: 60, 20: 40 },
            mariokart: { 9: 55, 10: 75, 11: 85, 12: 80, 13: 70, 14: 80, 15: 90, 16: 95, 17: 85, 18: 65, 19: 45, 20: 25 },
            yoshi: { 9: 5, 10: 15, 11: 25, 12: 30, 13: 25, 14: 30, 15: 35, 16: 40, 17: 35, 18: 25, 19: 15, 20: 10 },
            dragon: { 9: 5, 10: 20, 11: 30, 12: 35, 13: 30, 14: 35, 15: 40, 16: 45, 17: 40, 18: 30, 19: 20, 20: 15 },
            wing: { 9: 5, 10: 15, 11: 25, 12: 30, 13: 25, 14: 30, 15: 35, 16: 40, 17: 35, 18: 25, 19: 15, 20: 10 },
            hagrid: { 9: 55, 10: 65, 11: 75, 12: 80, 13: 70, 14: 75, 15: 85, 16: 90, 17: 80, 18: 65, 19: 45, 20: 30 },
            forbidden: { 9: 10, 10: 15, 11: 20, 12: 25, 13: 20, 14: 25, 15: 30, 16: 35, 17: 30, 18: 20, 19: 15, 20: 10 },
            gringotts: { 9: 15, 10: 45, 11: 60, 12: 75, 13: 65, 14: 70, 15: 80, 16: 85, 17: 75, 18: 60, 19: 40, 20: 20 }
        };

        const days = [
            { date: '27 feb', name: 'Sáb', park: 'Epic' },
            { date: '28 feb', name: 'Dom', park: 'Epic' },
            { date: '1 mar', name: 'Lun', park: 'IOA ↔ USF' },
            { date: '2 mar', name: 'Mar', park: 'USF → IOA' },
            { date: '3 mar', name: 'Mié', park: 'Epic' }
        ];

        let currentDay = 0;
        let itineraries = {};
        let draggedElement = null;

        const zoneColors = {
            nintendo: 'btn-nintendo',
            dark: 'btn-dark',
            berk: 'btn-berk',
            celestial: 'btn-celestial',
            harrypotter: 'btn-harrypotter',
            illumination: 'btn-illumination',
            marvel: 'btn-marvel',
            jurassic: 'btn-jurassic',
            seuss: 'btn-seuss'
        };

        const slotZoneColors = {
            nintendo: 'slot-nintendo',
            dark: 'slot-dark',
            berk: 'slot-berk',
            celestial: 'slot-celestial',
            harrypotter: 'slot-harrypotter',
            illumination: 'slot-illumination',
            marvel: 'slot-marvel',
            jurassic: 'slot-jurassic',
            seuss: 'slot-seuss'
        };

        function init() {
            loadItineraries();
            renderCountdown();
            renderDaySelector();
            renderTimeline();
            renderAttractions();
            updateStats();
            setInterval(renderCountdown, 1000);
        }

        function loadItineraries() {
            const saved = localStorage.getItem('universalItineraries');
            if (saved) {
                itineraries = JSON.parse(saved);
            } else {
                days.forEach((_, i) => {
                    itineraries[i] = [];
                });
            }
        }

        function saveItineraries() {
            localStorage.setItem('universalItineraries', JSON.stringify(itineraries));
        }

        function renderCountdown() {
            const tripDate = new Date(2027, 1, 26, 0, 0, 0);
            const now = new Date();
            const diff = tripDate - now;

            if (diff < 0) {
                document.getElementById('countdown').textContent = '¡En el viaje!';
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / (1000 * 60)) % 60);

            document.getElementById('countdown').textContent = `${String(d).padStart(2, '0')}d ${String(h).padStart(2, '0')}h ${String(m).padStart(2, '0')}m`;
        }

        function renderDaySelector() {
            const selector = document.getElementById('daySelector');
            selector.innerHTML = '';
            days.forEach((day, i) => {
                const btn = document.createElement('button');
                btn.className = `day-btn ${i === currentDay ? 'active' : ''}`;
                btn.textContent = `${day.name}\n${day.date}`;
                btn.style.whiteSpace = 'pre-line';
                btn.onclick = () => {
                    currentDay = i;
                    selector.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderTimeline();
                    updateStats();
                };
                selector.appendChild(btn);
            });
        }

        function renderTimeline() {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';

            for (let hour = 9; hour < 22; hour++) {
                const slot = document.createElement('div');
                slot.className = 'time-slot';
                slot.ondrop = (e) => handleDrop(e, hour);
                slot.ondragover = (e) => handleDragOver(e, slot);
                slot.ondragleave = (e) => slot.classList.remove('drag-over');

                const timeLabel = document.createElement('div');
                timeLabel.className = 'time-label';
                timeLabel.textContent = `${hour}:00`;

                const content = document.createElement('div');
                content.className = 'slot-content';

                const dayItinerary = itineraries[currentDay] || [];
                const attraction = dayItinerary.find(a => a.hour === hour);

                if (attraction) {
                    const card = document.createElement('div');
                    card.className = `attraction-in-slot ${slotZoneColors[attraction.zone] || ''}`;
                    card.draggable = true;
                    card.ondragstart = (e) => handleDragStart(e, attraction);

                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'attraction-name';
                    nameDiv.textContent = attraction.name;

                    const metaDiv = document.createElement('div');
                    metaDiv.className = 'attraction-meta';
                    const waitMin = getWaitTime(attraction.id, hour);
                    const endHour = hour + Math.ceil((waitMin + attraction.duration) / 60);
                    metaDiv.textContent = `${waitMin}min\n+${attraction.duration}m\n→${endHour}h`;

                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'remove-btn';
                    removeBtn.textContent = '✕';
                    removeBtn.onclick = (e) => {
                        e.stopPropagation();
                        itineraries[currentDay] = dayItinerary.filter(a => a.id !== attraction.id);
                        saveItineraries();
                        renderTimeline();
                        updateStats();
                    };

                    card.appendChild(nameDiv);
                    card.appendChild(metaDiv);
                    card.appendChild(removeBtn);
                    content.appendChild(card);
                }

                slot.appendChild(timeLabel);
                slot.appendChild(content);
                timeline.appendChild(slot);
            }

            renderSuggestions();
        }

        function handleDragStart(e, attraction) {
            draggedElement = attraction;
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e, slot) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            slot.classList.add('drag-over');
        }

        function handleDrop(e, hour) {
            e.preventDefault();
            e.target.closest('.time-slot').classList.remove('drag-over');

            if (!draggedElement) return;

            const dayItinerary = itineraries[currentDay] || [];
            itineraries[currentDay] = dayItinerary.filter(a => a.id !== draggedElement.id);
            itineraries[currentDay].push({
                id: draggedElement.id,
                name: draggedElement.name,
                hour: hour,
                duration: draggedElement.duration,
                park: draggedElement.park,
                zone: draggedElement.zone
            });

            saveItineraries();
            draggedElement = null;
            renderTimeline();
            updateStats();
        }

        function renderAttractions() {
            const list = document.getElementById('attractionsList');
            list.innerHTML = '';

            Object.keys(attractions).forEach(sectionName => {
                const section = document.createElement('div');
                section.className = 'park-section';

                const parkName = document.createElement('div');
                parkName.className = 'park-name';
                parkName.textContent = sectionName;

                const grid = document.createElement('div');
                grid.className = 'attractions-grid';

                attractions[sectionName].forEach(attr => {
                    const btn = document.createElement('button');
                    btn.className = `attraction-btn ${zoneColors[attr.zone] || ''}`;
                    btn.textContent = attr.name;
                    btn.draggable = true;
                    btn.ondragstart = (e) => {
                        draggedElement = attr;
                        e.dataTransfer.effectAllowed = 'move';
                    };
                    grid.appendChild(btn);
                });

                section.appendChild(parkName);
                section.appendChild(grid);
                list.appendChild(section);
            });
        }

        function getWaitTime(attractionId, hour) {
            const times = waitTimes[attractionId] || {};
            return times[hour] || 0;
        }

        function renderSuggestions() {
            const panel = document.getElementById('suggestionsPanel');
            const dayItinerary = itineraries[currentDay] || [];

            if (dayItinerary.length === 0) {
                panel.style.display = 'none';
                return;
            }

            const lastAttr = dayItinerary.reduce((prev, current) => {
                return prev.hour > current.hour ? prev : current;
            });

            const endHour = lastAttr.hour + Math.ceil((getWaitTime(lastAttr.id, lastAttr.hour) + lastAttr.duration) / 60);

            let allAttractions = [];
            Object.values(attractions).forEach(arr => allAttractions = allAttractions.concat(arr));
            
            const usedIds = new Set(dayItinerary.map(a => a.id));
            const available = allAttractions.filter(a => !usedIds.has(a.id));

            if (available.length === 0) {
                panel.style.display = 'none';
                return;
            }

            panel.style.display = 'block';
            const list = document.getElementById('suggestionsList');
            list.innerHTML = '';

            available.slice(0, 3).forEach(attr => {
                const wait = getWaitTime(attr.id, endHour);
                const suggestion = document.createElement('div');
                suggestion.className = 'suggestion-item';
                suggestion.textContent = `${attr.name}: ${wait > 0 ? wait + 'min + ' : ''}${attr.duration}m a las ${endHour}:00`;
                list.appendChild(suggestion);
            });
        }

        function updateStats() {
            const dayItinerary = itineraries[currentDay] || [];
            const totalWait = dayItinerary.reduce((sum, a) => sum + getWaitTime(a.id, a.hour), 0);
            const totalDuration = dayItinerary.reduce((sum, a) => sum + a.duration, 0);
            const total = totalWait + totalDuration;

            document.getElementById('statAttractions').textContent = dayItinerary.length;
            document.getElementById('statWaitTime').textContent = `${Math.floor(totalWait / 60)}h ${totalWait % 60}m`;
            document.getElementById('statDuration').textContent = `${Math.floor(total / 60)}h ${total % 60}m`;
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript,' + encodeURIComponent(`
                self.addEventListener('install', () => self.skipWaiting());
                self.addEventListener('activate', () => self.clients.claim());
            `)).catch(() => {});
        }

        init();
    </script>
</body>
</html>
