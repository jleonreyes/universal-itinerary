<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Universal Itinerario">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/jleonreyes/universal-itinerary/main/icon-192x192.png">
    <meta name="theme-color" content="#1e3a8a">
    <title>Universal Orlando Itinerario</title>
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Universal%20Orlando%20Itinerario%22,%22short_name%22:%22Universal%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%230f172a%22,%22theme_color%22:%22%231e3a8a%22,%22orientation%22:%22portrait%22}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            overflow-x: hidden;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }

        .container {
            max-width: 100%;
            padding: 16px max(16px, env(safe-area-inset-left));
            padding-right: max(16px, env(safe-area-inset-right));
        }

        header {
            margin-bottom: 24px;
            padding-top: max(16px, env(safe-area-inset-top));
        }

        .countdown {
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            text-align: center;
        }

        .countdown-label {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .countdown-value {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .day-selector {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 24px;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 8px;
        }

        .day-btn {
            flex-shrink: 0;
            padding: 8px 12px;
            border: 2px solid #334155;
            border-radius: 8px;
            background: transparent;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .day-btn.active {
            border-color: #3b82f6;
            background: #1e40af;
            color: #fff;
        }

        .day-btn:active {
            transform: scale(0.95);
        }

        .timeline-container {
            background: #1e293b;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            overflow-y: auto;
            max-height: 60vh;
            border: 1px solid #334155;
            -webkit-overflow-scrolling: touch;
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 600px;
            position: relative;
        }

        .time-slot {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 8px;
            min-height: 80px;
            border-radius: 8px;
            background: #0f172a;
            border: 2px dashed #334155;
        }

        .time-label {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            min-width: 50px;
            text-align: right;
            padding-top: 4px;
        }

        .slot-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .attraction-in-slot {
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 13px;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            gap: 8px;
        }

        .attraction-name {
            flex: 1;
        }

        .attraction-meta {
            font-size: 11px;
            color: rgba(255,255,255,0.8);
            line-height: 1.3;
        }

        .remove-btn {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.8);
            cursor: pointer;
            font-size: 16px;
            padding: 0;
            flex-shrink: 0;
        }

        .attractions-panel {
            background: #1e293b;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            border: 1px solid #334155;
        }

        .attractions-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #f1f5f9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .park-section {
            margin-bottom: 16px;
        }

        .park-name {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .attractions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
        }

        .attraction-btn {
            padding: 10px 8px;
            background: #334155;
            border: 2px solid;
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            text-align: center;
            word-break: break-word;
            -webkit-user-select: none;
        }

        .attraction-btn:active {
            transform: scale(0.95);
        }

        .btn-nintendo { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }
        .btn-dark { border-color: #6b21a8; background: rgba(107, 33, 168, 0.2); }
        .btn-berk { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); }
        .btn-celestial { border-color: #eab308; background: rgba(234, 179, 8, 0.2); }
        .btn-harrypotter { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); }
        .btn-marvel { border-color: #ec4899; background: rgba(236, 72, 153, 0.2); }
        .btn-jurassic { border-color: #92400e; background: rgba(146, 64, 14, 0.2); }
        .btn-illumination { border-color: #f97316; background: rgba(249, 115, 22, 0.2); }

        .slot-nintendo { background: rgba(239, 68, 68, 0.15); }
        .slot-dark { background: rgba(107, 33, 168, 0.15); }
        .slot-berk { background: rgba(34, 197, 94, 0.15); }
        .slot-celestial { background: rgba(234, 179, 8, 0.15); }
        .slot-harrypotter { background: rgba(59, 130, 246, 0.15); }
        .slot-marvel { background: rgba(236, 72, 153, 0.15); }
        .slot-jurassic { background: rgba(146, 64, 14, 0.15); }
        .slot-illumination { background: rgba(249, 115, 22, 0.15); }

        .stats {
            background: #1e293b;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 12px;
            border: 1px solid #334155;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-weight: 700;
            color: #60a5fa;
            font-size: 16px;
        }

        .stat-label {
            color: #64748b;
            font-size: 11px;
            margin-top: 4px;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            padding: 16px;
            justify-content: center;
            align-items: center;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            max-width: 90%;
            border: 1px solid #334155;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 16px;
            text-align: center;
        }

        .hours-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .hour-btn {
            padding: 12px;
            background: #334155;
            border: 2px solid #475569;
            border-radius: 6px;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-user-select: none;
            user-select: none;
        }

        .hour-btn:active {
            background: #475569;
            border-color: #3b82f6;
            color: #3b82f6;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            -webkit-user-select: none;
            user-select: none;
        }

        .modal-btn.cancel {
            background: #334155;
            color: #cbd5e1;
        }

        .modal-btn.cancel:active {
            background: #475569;
        }

        .modal-btn.confirm {
            background: #3b82f6;
            color: #fff;
        }

        .modal-btn.confirm:active {
            background: #1e40af;
        }

        @media (max-height: 667px) {
            .timeline-container {
                max-height: 50vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="countdown">
                <div class="countdown-label">Faltan</div>
                <div class="countdown-value" id="countdown">00d 00h 00m</div>
            </div>
            <h1>Universal Orlando</h1>
            <p style="font-size: 13px; color: #94a3b8;">26 feb – 4 mar 2027</p>
        </header>

        <div class="day-selector" id="daySelector"></div>

        <div class="stats" id="stats">
            <div class="stat">
                <div class="stat-value" id="statAttractions">0</div>
                <div class="stat-label">Atracciones</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="statWaitTime">0h</div>
                <div class="stat-label">Espera Total</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="statDuration">0h</div>
                <div class="stat-label">Duración Total</div>

        </div>

        <div class="timeline-container" id="timelineContainer">

        </div>

        <div class="attractions-panel">
            <div class="attractions-title">Atracciones Disponibles</div>

        </div>
    </div>

    <!-- Modal de selección de hora -->
    <div class="modal" id="hourModal">

            <div class="modal-title" id="modalTitle">Selecciona horario</div>
            <div class="hours-grid" id="hoursGrid"></div>
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeModal()">Cancelar</button>
                <button class="modal-btn confirm" id="confirmBtn" onclick="confirmHour()" style="display:none;">Agregar</button>

                { id: 'honeydukes', name: 'Honeydukes (Comida)', duration: 30, park: 'IOA', zone: 'harrypotter' }
            ],

                { id: 'hulk', name: 'The Incredible Hulk Coaster', duration: 3, park: 'IOA', zone: 'marvel' }
            ],

            ],

                { id: 'express_kc', name: 'Hogwarts Express (Kings Cross)', duration: 9, park: 'USF', zone: 'harrypotter' },
                { id: 'florean', name: 'Florean Fortescue (Comida)', duration: 30, park: 'USF', zone: 'harrypotter' }
            ],
            'USF - New York': [
                { id: 'mummy', name: 'Revenge of the Mummy', duration: 4, park: 'USF', zone: 'dark' }
            ],
            'USF - Hollywood': [
                { id: 'et', name: 'E.T. Adventure', duration: 4, park: 'USF', zone: 'illumination' },
                { id: 'bourne', name: 'The Bourne Stuntacular (Show)', duration: 20, park: 'USF', zone: 'illumination' }
            ],
            'USF - Minion Land': [
                { id: 'despicable', name: 'Despicable Me Minion Mayhem', duration: 4, park: 'USF', zone: 'illumination' },
                { id: 'villain', name: 'Illumination\'s Villain-Con Minion Blast', duration: 4, park: 'USF', zone: 'illumination' }
            ],
            'USF - World Expo': [
                { id: 'mib', name: 'Men in Black: Alien Attack', duration: 4, park: 'USF', zone: 'illumination' }
            ],
            'USF - Production Central': [
                { id: 'transformers', name: 'Transformers: The Ride 3D', duration: 4, park: 'USF', zone: 'illumination' }
            ]
        };

        const waitTimes = {
            battle: { 9: 60, 10: 70, 11: 95, 12: 120, 13: 140, 14: 150, 15: 170, 16: 180, 17: 205, 18: 180, 19: 120, 20: 90 },
            minecart: { 9: 0, 10: 120, 11: 120, 12: 120, 13: 120, 14: 120, 15: 120, 16: 120, 17: 0, 18: 75, 19: 75, 20: 75 },
            mariokart: { 9: 85, 10: 100, 11: 120, 12: 120, 13: 120, 14: 120, 15: 120, 16: 120, 17: 75, 18: 60, 19: 50, 20: 40 },
            yoshi: { 9: 0, 10: 40, 11: 40, 12: 50, 13: 60, 14: 70, 15: 80, 16: 85, 17: 35, 18: 25, 19: 20, 20: 15 },
            dragon: { 9: 0, 10: 40, 11: 40, 12: 60, 13: 80, 14: 90, 15: 100, 16: 110, 17: 20, 18: 15, 19: 10, 20: 5 },
            wing: { 9: 0, 10: 45, 11: 45, 12: 60, 13: 80, 14: 90, 15: 100, 16: 110, 17: 35, 18: 30, 19: 25, 20: 20 },
            fyre: { 9: 0, 10: 25, 11: 25, 12: 40, 13: 50, 14: 60, 15: 70, 16: 80, 17: 5, 18: 5, 19: 5, 20: 5 },
            monsters: { 9: 0, 10: 15, 11: 15, 12: 20, 13: 30, 14: 40, 15: 50, 16: 60, 17: 15, 18: 10, 19: 8, 20: 5 },
            curse: { 9: 0, 10: 50, 11: 50, 12: 70, 13: 90, 14: 100, 15: 110, 16: 120, 17: 60, 18: 45, 19: 35, 20: 30 },
            hagrid: { 9: 75, 10: 80, 11: 90, 12: 100, 13: 110, 14: 120, 15: 130, 16: 140, 17: 100, 18: 80, 19: 60, 20: 45 },
            gringotts: { 9: 20, 10: 25, 11: 30, 12: 40, 13: 50, 14: 60, 15: 70, 16: 75, 17: 50, 18: 35, 19: 25, 20: 15 },
            despicable: { 9: 45, 10: 50, 11: 55, 12: 60, 13: 70, 14: 75, 15: 80, 16: 85, 17: 60, 18: 45, 19: 30, 20: 20 }
        };

        const days = [
            { date: '27 feb', name: 'Sáb', park: 'Epic' },
            { date: '28 feb', name: 'Dom', park: 'Epic' },
            { date: '1 mar', name: 'Lun', park: 'IOA ↔ USF' },
            { date: '2 mar', name: 'Mar', park: 'USF → IOA' },
            { date: '3 mar', name: 'Mié', park: 'Epic' }
        ];

        let currentDay = 0;
        let itineraries = {};
        let selectedAttraction = null;
        let selectedHour = null;

        const zoneColors = {
            nintendo: 'btn-nintendo',
            dark: 'btn-dark',
            berk: 'btn-berk',
            celestial: 'btn-celestial',
            harrypotter: 'btn-harrypotter',
            illumination: 'btn-illumination',
            marvel: 'btn-marvel',
            jurassic: 'btn-jurassic'
        };

        const slotZoneColors = {
            nintendo: 'slot-nintendo',
            dark: 'slot-dark',
            berk: 'slot-berk',
            celestial: 'slot-celestial',
            harrypotter: 'slot-harrypotter',
            illumination: 'slot-illumination',
            marvel: 'slot-marvel',
            jurassic: 'slot-jurassic'
        };

        function init() {
            loadItineraries();
            renderCountdown();
            renderDaySelector();
            renderTimeline();
            renderAttractions();
            updateStats();
            setInterval(renderCountdown, 1000);
        }

        function loadItineraries() {
            const saved = localStorage.getItem('universalItineraries');
            if (saved) {
                itineraries = JSON.parse(saved);
            } else {
                days.forEach((_, i) => {
                    itineraries[i] = [];
                });
            }
        }

        function saveItineraries() {
            localStorage.setItem('universalItineraries', JSON.stringify(itineraries));
        }

        function renderCountdown() {
            const tripDate = new Date(2027, 1, 26, 0, 0, 0);
            const now = new Date();
            const diff = tripDate - now;

            if (diff < 0) {
                document.getElementById('countdown').textContent = '¡En el viaje!';
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / (1000 * 60)) % 60);

            document.getElementById('countdown').textContent = `${String(d).padStart(2, '0')}d ${String(h).padStart(2, '0')}h ${String(m).padStart(2, '0')}m`;
        }

        function renderDaySelector() {
            const selector = document.getElementById('daySelector');
            selector.innerHTML = '';
            days.forEach((day, i) => {
                const btn = document.createElement('button');
                btn.className = `day-btn ${i === currentDay ? 'active' : ''}`;
                btn.textContent = `${day.name}\n${day.date}`;
                btn.style.whiteSpace = 'pre-line';
                btn.onclick = () => {
                    currentDay = i;
                    selector.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderTimeline();
                    updateStats();
                };
                selector.appendChild(btn);
            });
        }

        function renderTimeline() {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';

            for (let hour = 9; hour < 22; hour++) {
                const slot = document.createElement('div');
                slot.className = 'time-slot';

                const timeLabel = document.createElement('div');
                timeLabel.className = 'time-label';
                timeLabel.textContent = `${hour}:00`;

                const content = document.createElement('div');
                content.className = 'slot-content';

                const dayItinerary = itineraries[currentDay] || [];
                const attraction = dayItinerary.find(a => a.hour === hour);

                if (attraction) {
                    const card = document.createElement('div');
                    card.className = `attraction-in-slot ${slotZoneColors[attraction.zone] || ''}`;

                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'attraction-name';
                    nameDiv.textContent = attraction.name;

                    const metaDiv = document.createElement('div');
                    metaDiv.className = 'attraction-meta';
                    const waitMin = getWaitTime(attraction.id, hour);
                    const endHour = hour + Math.ceil((waitMin + attraction.duration) / 60);
                    metaDiv.textContent = `${waitMin}min\n+${attraction.duration}m\n→${endHour}h`;

                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'remove-btn';
                    removeBtn.textContent = '✕';
                    removeBtn.onclick = (e) => {
                        e.stopPropagation();
                        itineraries[currentDay] = dayItinerary.filter(a => a.id !== attraction.id);
                        saveItineraries();
                        renderTimeline();
                        updateStats();
                    };

                    card.appendChild(nameDiv);
                    card.appendChild(metaDiv);
                    card.appendChild(removeBtn);
                    content.appendChild(card);
                }

                slot.appendChild(timeLabel);
                slot.appendChild(content);
                timeline.appendChild(slot);
            }
        }

        function openHourModal(attraction) {
            selectedAttraction = attraction;
            selectedHour = null;
            document.getElementById('modalTitle').textContent = `${attraction.name} - Selecciona horario`;
            
            const hoursGrid = document.getElementById('hoursGrid');
            hoursGrid.innerHTML = '';
            
            const dayItinerary = itineraries[currentDay] || [];
            const usedHours = new Set(dayItinerary.map(a => a.hour));
            
            for (let hour = 9; hour < 22; hour++) {
                const btn = document.createElement('button');
                btn.className = 'hour-btn';
                btn.textContent = `${hour}:00`;
                btn.disabled = usedHours.has(hour);
                btn.style.opacity = usedHours.has(hour) ? '0.5' : '1';
                btn.onclick = () => {
                    selectedHour = hour;
                    document.querySelectorAll('.hour-btn').forEach(b => b.style.borderColor = '#475569');
                    btn.style.borderColor = '#3b82f6';
                    document.getElementById('confirmBtn').style.display = 'block';
                };
                hoursGrid.appendChild(btn);
            }
            
            document.getElementById('confirmBtn').style.display = 'none';
            document.getElementById('hourModal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('hourModal').classList.remove('open');
            selectedAttraction = null;
            selectedHour = null;
        }

        function confirmHour() {
            if (selectedAttraction && selectedHour !== null) {
                const dayItinerary = itineraries[currentDay] || [];
                dayItinerary.push({
                    id: selectedAttraction.id,
                    name: selectedAttraction.name,
                    hour: selectedHour,
                    duration: selectedAttraction.duration,
                    park: selectedAttraction.park,
                    zone: selectedAttraction.zone
                });
                itineraries[currentDay] = dayItinerary;
                saveItineraries();
                closeModal();
                renderTimeline();
                updateStats();
            }
        }

        function renderAttractions() {
            const list = document.getElementById('attractionsList');
            list.innerHTML = '';

            Object.keys(attractions).forEach(sectionName => {
                const section = document.createElement('div');
                section.className = 'park-section';

                const parkName = document.createElement('div');
                parkName.className = 'park-name';
                parkName.textContent = sectionName;

                const grid = document.createElement('div');
                grid.className = 'attractions-grid';

                attractions[sectionName].forEach(attr => {
                    const btn = document.createElement('button');
                    btn.className = `attraction-btn ${zoneColors[attr.zone] || ''}`;
                    btn.textContent = attr.name;
                    btn.onclick = () => openHourModal(attr);
                    grid.appendChild(btn);
                });

                section.appendChild(parkName);
                section.appendChild(grid);
                list.appendChild(section);
            });
        }

        function getWaitTime(attractionId, hour) {
            const times = waitTimes[attractionId] || {};
            return times[hour] || 0;
        }

        function updateStats() {
            const dayItinerary = itineraries[currentDay] || [];
            const totalWait = dayItinerary.reduce((sum, a) => sum + getWaitTime(a.id, a.hour), 0);
            const totalDuration = dayItinerary.reduce((sum, a) => sum + a.duration, 0);
            const total = totalWait + totalDuration;

            document.getElementById('statAttractions').textContent = dayItinerary.length;
            document.getElementById('statWaitTime').textContent = `${Math.floor(totalWait / 60)}h ${totalWait % 60}m`;
            document.getElementById('statDuration').textContent = `${Math.floor(total / 60)}h ${total % 60}m`;
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript,' + encodeURIComponent(`
                self.addEventListener('install', () => self.skipWaiting());
                self.addEventListener('activate', () => self.clients.claim());
            `)).catch(() => {});
        }

        init();
    </script>
</body>
</html>
