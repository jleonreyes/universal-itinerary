<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Universal">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/jleonreyes/universal-itinerary/main/icon-192x192.png">
<meta name="theme-color" content="#0f172a">
<title>Universal Orlando 2027</title>
<style>
:root{
  --bg:#0f172a; --panel:#1e293b; --panel2:#172033; --line:#334155;
  --text:#e2e8f0; --muted:#94a3b8; --dim:#64748b;
  --accent:#3b82f6; --bad:#f87171; --badbg:rgba(248,113,113,.12); --free:#34d399;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;color:var(--text);
  padding-bottom:calc(96px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
.wrap{max-width:720px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-left)) 0 max(14px,env(safe-area-inset-right))}

/* Top */
.top{padding-top:calc(env(safe-area-inset-top) + 10px)}
.count{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--muted);padding:6px 2px 10px}
.count b{color:#fff;font-variant-numeric:tabular-nums;font-size:15px}
.tabs-bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top)) 0 8px;margin:0 -14px;padding-left:14px;padding-right:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-top:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:2px solid var(--line);border-radius:10px;padding:6px 12px;text-align:center;line-height:1.25;font-size:13px;font-weight:600;color:#cbd5e1}
.tab small{display:block;font-weight:500;font-size:12px}
.tab.on{border-color:var(--accent);background:#1e40af;color:#fff}

/* Day header */
.dayhead{padding:14px 2px 10px}
.dayhead .n{font-size:12px;color:var(--dim);letter-spacing:.3px}
.dayhead h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:30px;line-height:1.1;color:#fff;margin:2px 0 6px}
.dayhead .park{font-size:17px;font-weight:700;color:#f0abfc}
.dayhead .sub{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}

.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 4px;margin:6px 0 12px;text-align:center}
.stats .v{font-size:17px;font-weight:700;color:#60a5fa;font-variant-numeric:tabular-nums}
.stats .l{font-size:11px;color:var(--dim);margin-top:2px}
.stats .v.bad{color:var(--bad)}

/* Timeline */
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:52px 1fr;gap:10px;width:100%;text-align:left;padding:11px 8px 11px 6px;border-bottom:1px solid var(--line);position:relative;border-left:6px solid var(--z,var(--dim))}
.row:active{filter:brightness(1.25)}
.row{background:var(--zb,transparent)}
.row .t{text-shadow:0 1px 2px rgba(0,0,0,.35)}
.row .t{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.row.major .t{color:#fff;font-weight:700}
.row .t.bad{color:var(--bad)}
.row .nm{font-size:16px;line-height:1.3}
.row.major .nm{font-weight:700}
.row .d{font-size:13px;color:#cbd5e1;font-weight:400}
.row .m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px;font-size:11px}
.chip{border-radius:5px;padding:2px 6px;font-weight:600;letter-spacing:.2px}
.chip.obl{color:#fff;background:#dc2626}
.chip.sin{color:#e2e8f0;background:rgba(15,23,42,.45)}
.chip.wet{color:#0c4a6e;background:#7dd3fc}
.chip.pin{color:#422006;background:#fde047}
.occ{color:#a8b4c6;font-variant-numeric:tabular-nums}
.row.now{outline:2px solid var(--free);outline-offset:-2px}
.row.now .t::after{content:"AHORA";display:block;font-size:9px;color:var(--free);font-weight:800;margin-top:3px}
.row.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{filter:brightness(1.8)}100%{filter:none}}
.gap{font-size:12px;color:var(--free);padding:6px 10px 6px 66px;border-bottom:1px dashed var(--line)}
.clash{font-size:12.5px;color:var(--bad);background:var(--badbg);padding:8px 10px 8px 66px;border-bottom:1px solid var(--line);line-height:1.35}

.tip{margin:16px 0 8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;color:#cbd5e1}
.tip summary{font-weight:700;color:#fff;list-style:none}
.tip summary::-webkit-details-marker{display:none}
.tip p{margin-top:8px}
.reset{display:block;margin:14px auto 0;font-size:13px;color:var(--dim);text-decoration:underline;padding:8px}
.help{font-size:12.5px;color:var(--dim);text-align:center;margin:10px 0 0;line-height:1.4}

.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;
  background:var(--accent);color:#fff;font-weight:700;font-size:16px;border-radius:28px;padding:14px 20px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.fab:active{transform:scale(.96)}

/* Sheets */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--panel);border-radius:18px 18px 0 0;border-top:1px solid var(--line);
  max-height:90vh;max-height:90dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(105%);transition:transform .25s ease;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#475569;margin:2px auto 12px}
.sh-title{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.in{width:100%;font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:#fff;padding:10px 12px;font-family:inherit}
.in.big{font-size:18px;font-weight:700}
.when{font-size:14px;color:var(--muted);margin:4px 0 12px}
.when b{color:#fff}
.when .bad{color:var(--bad);font-weight:600}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.field>span small{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.field.col{flex-direction:column;align-items:stretch}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:38px;border-radius:10px;background:#334155;font-size:20px;font-weight:700}
.step button:active{background:#475569}
.step .val{min-width:62px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:8px 11px;font-size:14px;color:var(--muted)}
.seg button.on{background:#334155;color:#fff;font-weight:600}
.switch input{width:50px;height:30px;appearance:none;-webkit-appearance:none;background:#334155;border-radius:15px;position:relative;transition:background .2s;flex:0 0 auto}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.switch input:checked{background:#22c55e}
.switch input:checked::after{left:23px}
input[type=time]{font-size:17px;background:var(--bg);color:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-family:inherit;min-width:110px}
.hint{font-size:12px;color:var(--dim);margin:-4px 0 8px;line-height:1.4}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.acts button{background:#334155;border-radius:10px;padding:12px;font-size:15px;font-weight:600}
.acts button:active{background:#475569}
.acts .del{color:#fca5a5}
.done{width:100%;margin-top:10px;background:var(--accent);color:#fff;font-weight:700;border-radius:12px;padding:14px;font-size:16px}

.cat-top{position:sticky;top:-8px;background:var(--panel);padding:4px 0 10px;z-index:2}
.cat-top label{font-size:13px;color:var(--muted);display:block;margin:6px 0 4px}
select.in{appearance:none;-webkit-appearance:none}
.grp{font-size:12px;font-weight:800;color:var(--gz,var(--dim));letter-spacing:.4px;text-transform:uppercase;margin:16px 0 6px}
.ci{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 10px;border-radius:10px;background:var(--zb,var(--bg));margin-bottom:6px;border-left:6px solid var(--z)}
.ci:active{filter:brightness(1.25)}
.ci .x{flex:1;min-width:0}
.ci .x b{display:block;font-size:15px}
.ci .x small{color:#cbd5e1;font-size:12px}
.ci .plus{font-size:22px;color:#fff;font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:#f1f5f9;color:#0f172a;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;z-index:80;display:flex;gap:14px;align-items:center;transition:all .2s;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{color:#1d4ed8;font-weight:800}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="count"><span>Universal · 26 feb – 4 mar</span><b id="countdown"></b></div>
  </div>
  <div class="tabs-bar"><div class="tabs" id="tabs"></div></div>

  <div class="dayhead">
    <div class="n" id="dNum"></div>
    <h1 id="dTitle"></h1>
    <div class="park" id="dPark"></div>
    <div class="sub" id="dSub"></div>
  </div>

  <div class="stats">
    <div><div class="v" id="sRides">0</div><div class="l">Atracciones</div></div>
    <div><div class="v" id="sQueue">0</div><div class="l">Fila máx. sumada</div></div>
    <div><div class="v" id="sEnd">–</div><div class="l" id="sEndL">Termina</div></div>
  </div>

  <div class="list" id="list"></div>
  <p class="help">Toca cualquier renglón para cambiar fila, duración u hora fija, moverlo o borrarlo. Lo que sigue se recorre solo.</p>

  <details class="tip" id="tip"><summary>Notas del día</summary><p id="tipText"></p></details>
  <button class="reset" id="resetBtn">Restaurar el itinerario original de este día</button>
</div>

<button class="fab" id="fab">＋ Agregar</button>

<div class="backdrop" id="backdrop"></div>

<div class="sheet" id="editSheet"><div class="grab"></div><div id="editBody"></div></div>

<div class="sheet" id="catSheet">
  <div class="grab"></div>
  <div class="cat-top">
    <label for="afterSel">Agregar después de</label>
    <select class="in" id="afterSel"></select>
    <label for="q">Buscar</label>
    <input class="in" id="q" type="search" placeholder="Atracción, show, comida…" autocomplete="off">
  </div>
  <div id="catList"></div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Deshacer</button></div>

<script>
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const toMin = s => { const [h,m] = s.split(':').map(Number); return h*60 + m; };
const fmt = m => { m = Math.round(m); return Math.floor(m/60) + ':' + pad(((m%60)+60)%60); };
const hhmm = m => pad(Math.floor(m/60)) + ':' + pad(m%60);
const secs = s => { if(!s) return 0; const [a,b] = s.split(':').map(Number); return a*60 + (b||0); };
const rideFmt = s => Math.floor(s/60) + ':' + pad(s%60);
const ceil5 = m => Math.ceil(m/5)*5;
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- zonas y colores ---------- */
const ZC = {
  hpe:'#6366f1', hpi:'#38bdf8', hpu:'#3b82f6', hp:'#3b82f6', nintendo:'#f87171', berk:'#4ade80', dark:'#a78bfa', celestial:'#facc15',
  marvel:'#f472b6', jurassic:'#c08a3e', illum:'#fb923c', seuss:'#2dd4bf', toon:'#e879f9',
  usf:'#fda4af', dw:'#a3e635', log:'#475569'
};
const zc = z => ZC[z] || ZC.log;
// Fondo de color del renglón: más intenso en atracciones y shows
const tint = (hex,a) => { const n = parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };
const zbg = (z,strong) => z === 'log' ? 'transparent' : tint(zc(z), strong ? .5 : .3);

/* ---------- itinerario estudiado (PDF) ---------- */

const R = (t,name,zone,q,ride,lk='',note='',o={}) => ({t,name,zone,type:'ride',qMin:q[0],qMax:q[1],ride:secs(ride),
  lk:lk.replace('-moja',''), wet:lk.includes('moja'), note, ...o});
const X = (t,name,zone,note='',type='other',o={}) => ({t,name,zone,note,type,...o});
const L = (t,name,note='',o={}) => X(t,name,'log',note,'log',o);

   tip:'Battle at the Ministry va primera, sin excepción. El early entry es su ventana más barata del día: arranca cerca de 50–70 min y sube sin parar hasta 85+ a media mañana. Además Universal cierra su fila por capacidad, a veces varias horas antes del cierre, así que dejarla para la tarde o la noche es arriesgar perderla. El costo de ir primero es que Berk sube de 5 a 25–40 min, pero es el intercambio correcto.',

 { key:'2027-03-02', tab:['Mar','2 mar'], title:'Martes 2 de marzo', park:'USF → IOA',

   tip:'Opcionales, solo con espera razonable: Revenge of the Mummy en New York y Skull Island: Kong en Jurassic, ambas oscuras y con sustos. Rellenos: Kang & Kodos en Springfield, Storm Force en Marvel y Bilge-Rat Barges en Toon Lagoon, que empapa por completo.',

const KEY = 'uo27.itinerario.v2';
function build(seed){
  return seed.map((s,i) => {
    const t = toMin(s.t), next = seed[i+1];
    const dur = s.d ?? (next ? toMin(next.t) - t : 30);
    return { id:uid(), name:s.name, note:s.note||'', zone:s.zone, type:s.type,
      qMin:s.qMin||0, qMax:s.qMax||0, ride:s.ride||0, lk:s.lk||'', wet:!!s.wet, walk:5,
      fixed: !!s.fixed || i===0, at:t, dur };
  });
}
let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
if(!state || !state.days) state = { days:{} };
DAYS.forEach(d => { if(!Array.isArray(state.days[d.key])) state.days[d.key] = build(d.seed); });
// Si ya tenías guardado el itinerario con el azul único de Harry Potter, lo pasa al tono de su parque
(() => {
  const byName = {};
  CAT.forEach(([g,arr]) => arr.forEach(c => byName[c.name] = c.zone));
  DAYS.forEach(d => d.seed.forEach(s => byName[s.name] = s.zone));
  DAYS.forEach(d => state.days[d.key].forEach((it,i,list) => {
    if(it.zone !== 'hp') return;
    it.zone = (d.key === '2027-03-01' && /Express → Hogsmeade/.test(it.name)) ? 'hpu' : (byName[it.name] || (d.park === 'Epic Universe' ? 'hpe' : 'hpi'));
  }));
})();

/* ---------- cálculo de horarios ---------- */
// Cada renglón empieza cuando termina el anterior, salvo los de hora fija.
function schedule(list){
  let t = null;
  return list.map(it => {
    let start, gap = 0, clash = 0;
    if(it.fixed || t === null){
      start = it.at ?? t ?? 480;
      if(t !== null){ if(t > start) clash = t - start; else gap = start - t; }
    } else start = t;
    t = start + it.dur;
    return { start, end:t, gap, clash };
  });
}
const rideDur = it => ceil5(it.qMax + it.ride/60 + it.walk);

function detail(it){
  if(it.type === 'ride'){
    const p = [];
    if(it.qMax > 0) p.push(`${it.qMin}–${it.qMax} fila`);
    if(it.ride > 0) p.push(`+ ${rideFmt(it.ride)}`);
    let s = p.join(' ');
    if(it.note) s += (s ? ' · ' : '') + it.note;
    return s;
  }
  return it.note || '';
}
function chips(it){
  let h = '';
  if(it.lk === 'obl') h += '<span class="chip obl">Locker obligatorio</span>';
  if(it.lk === 'sin') h += '<span class="chip sin">Sin locker</span>';
  if(it.wet) h += '<span class="chip wet">Se moja</span>';
  if(it.fixed) h += '<span class="chip pin">Hora fija</span>';
  return h;
}

function renderTabs(){
  $('#tabs').innerHTML = DAYS.map((d,i) =>
    `<button class="tab ${i===cur?'on':''}" data-i="${i}">${d.tab[0]}<small>${d.tab[1]}</small></button>`).join('');
}
function render(){
  const d = DAYS[cur], list = items(), sc = schedule(list);
  $('#dNum').textContent = `${cur+1} de ${DAYS.length}`;
  $('#dTitle').textContent = d.title;
  $('#dPark').textContent = d.park;
  $('#dSub').textContent = d.sub;
  $('#tipText').textContent = d.tip;

  const now = new Date(), nowMin = now.getHours()*60 + now.getMinutes();
  const isToday = d.key === todayKey;
  let html = '';
  list.forEach((it,i) => {
    const s = sc[i];
    if(s.gap >= 5) html += `<div class="gap">Tiempo libre · ${s.gap} min</div>`;
    if(s.clash > 0) html += `<div class="clash">⚠ Te pasas ${s.clash} min: lo anterior termina a las ${fmt(s.start + s.clash)} y esto es a las ${fmt(s.start)}. Quita algo o acorta una fila.</div>`;
    const major = it.type === 'ride' || it.type === 'show';
    const isNow = isToday && nowMin >= s.start && nowMin < s.end;
    html += `<button class="row ${major?'major':''} ${isNow?'now':''}" data-id="${it.id}" style="--z:${zc(it.zone)};--zb:${zbg(it.zone, major)}">
      <span class="t ${s.clash?'bad':''}">${fmt(s.start)}</span>
      <span class="b"><span class="nm">${esc(it.name)}</span> <span class="d">${esc(detail(it))}</span>
        <span class="m">${chips(it)}<span class="occ">${it.dur} min · hasta ${fmt(s.end)}</span></span></span>
    </button>`;
  });
  $('#list').innerHTML = html || '<p class="help" style="padding:24px 0">Sin actividades. Toca ＋ Agregar.</p>';

  const rides = list.filter(x => x.type === 'ride' && x.qMax > 0);
  const q = rides.reduce((a,x) => a + x.qMax, 0);
  $('#sRides').textContent = list.filter(x => x.type === 'ride').length;
  $('#sQueue').textContent = `${Math.floor(q/60)}h ${q%60}m`;
  const clashes = sc.filter(s => s.clash > 0).length;
  const sEnd = $('#sEnd');
  if(clashes){ sEnd.textContent = clashes; sEnd.classList.add('bad'); $('#sEndL').textContent = clashes===1?'Empalme':'Empalmes'; }
  else { sEnd.textContent = sc.length ? fmt(sc[sc.length-1].end) : '–'; sEnd.classList.remove('bad'); $('#sEndL').textContent = 'Termina'; }
}

function renderCountdown(){
  const diff = new Date(2027,1,26,0,0,0) - new Date();
  const el = $('#countdown');
  if(diff <= 0){ el.textContent = '¡Ya estamos aquí!'; return; }
  const d = Math.floor(diff/864e5), h = Math.floor(diff/36e5)%24, m = Math.floor(diff/6e4)%60;
  el.textContent = `${d}d ${pad(h)}h ${pad(m)}m`;
}

let editId = null, undoSnap = null, toastTimer = null;
function openSheet(id){

}
function closeSheets(){

  document.activeElement && document.activeElement.blur && document.activeElement.blur();

function stepper(key,label,val,sub=''){
  return `<div class="field"><span>${label}${sub?`<small>${sub}</small>`:''}</span>
    <div class="step"><button data-step="${key}" data-d="-1">−</button><span class="val">${val}</span><button data-step="${key}" data-d="1">+</button></div></div>`;
}
function seg(key,opts,val){
  return `<div class="seg">${opts.map(([v,l]) => `<button data-seg="${key}" data-v="${v}" class="${String(val)===String(v)?'on':''}">${l}</button>`).join('')}</div>`;
}

function openEdit(id){ editId = id; renderEdit(); openSheet('editSheet'); }
function renderEdit(){
  const list = items(), i = list.findIndex(x => x.id === editId);
  if(i < 0) return closeSheets();
  const it = list[i], s = schedule(list)[i], ride = it.type === 'ride';
  $('#editBody').innerHTML = `
    <div class="sh-title"><span class="dot" style="background:${zc(it.zone)};width:16px;height:16px"></span><input class="in big" id="eName" value="${esc(it.name)}"></div>

    <label class="field switch"><span>Hora fija<small>Shows y funciones: no se mueve aunque cambie lo anterior</small></span><input type="checkbox" id="eFixed" ${it.fixed?'checked':''}></label>
    ${it.fixed ? `<div class="field"><span>Hora</span><input type="time" id="eAt" step="300" value="${hhmm(it.at ?? s.start)}"></div>` : ''}
    ${ride ? stepper('qMin','Fila mínima',`${it.qMin} min`) + stepper('qMax','Fila máxima',`${it.qMax} min`,'Con esta se calcula el horario')
           + stepper('ride','Duración del juego',rideFmt(it.ride))
           + `<div class="field"><span>Caminar al siguiente</span>${seg('walk',[[0,'0'],[5,'5'],[10,'10']],it.walk)}</div>` : ''}
    ${stepper('dur','Ocupa en total',`${it.dur} min`, ride ? 'Fila máx. + juego + caminar, redondeado a 5' : '')}
    ${ride ? `<div class="field"><span>Locker</span>${seg('lk',[['obl','Obligatorio'],['sin','Sin'],['','—']],it.lk)}</div>
              <label class="field switch"><span>Se moja</span><input type="checkbox" id="eWet" ${it.wet?'checked':''}></label>` : ''}
    <div class="field col"><span>Nota</span><input class="in" id="eNote" value="${esc(it.note)}" placeholder="Ej. función fija · 25 min"></div>
    <div class="acts">
      <button data-act="up" ${i===0?'disabled style="opacity:.4"':''}>↑ Subir</button>
      <button data-act="down" ${i===list.length-1?'disabled style="opacity:.4"':''}>↓ Bajar</button>
      <button data-act="insert">＋ Agregar después</button>
      <button data-act="del" class="del">Eliminar</button>
    </div>
    <button class="done" data-act="close">Listo</button>`;
}
function curItem(){ return items().find(x => x.id === editId); }
function commit(rerenderSheet=true){ save(); render(); if(rerenderSheet) renderEdit(); }

$('#editBody').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const it = curItem(); if(!it) return;
  if(b.dataset.step){
    const k = b.dataset.step, d = +b.dataset.d;
    if(k === 'qMin') it.qMin = Math.max(0, it.qMin + d*5);
    if(k === 'qMax') it.qMax = Math.max(0, it.qMax + d*5);
    if(k === 'ride') it.ride = Math.max(0, it.ride + d*30);
    if(k === 'dur')  it.dur  = Math.max(0, it.dur + d*5);
    if(it.qMin > it.qMax) { if(k==='qMin') it.qMax = it.qMin; else it.qMin = it.qMax; }
    if(it.type === 'ride' && k !== 'dur') it.dur = rideDur(it);
    return commit();
  }
  if(b.dataset.seg){
    const k = b.dataset.seg, v = b.dataset.v;
    if(k === 'walk'){ it.walk = +v; it.dur = rideDur(it); }
    if(k === 'lk') it.lk = v;
    return commit();
  }
  const act = b.dataset.act, list = items(), i = list.indexOf(it);
  if(act === 'close') return closeSheets();
  if(act === 'up' && i > 0){ [list[i-1], list[i]] = [list[i], list[i-1]]; return commit(); }
  if(act === 'down' && i < list.length-1){ [list[i+1], list[i]] = [list[i], list[i+1]]; return commit(); }
  if(act === 'insert'){ const id = it.id; closeSheets(); return openCatalog(id); }
  if(act === 'del'){
    undoSnap = { key:DAYS[cur].key, list: JSON.parse(JSON.stringify(list)) };
    const before = schedule(list);
    list.splice(i,1);
    if(i === 0 && list[0]) { list[0].fixed = true; list[0].at = before[1].start; }
    closeSheets(); save(); render();
    toast(`Eliminado: ${it.name}`);
  }
});
$('#editBody').addEventListener('input', e => {
  const it = curItem(); if(!it) return;
  if(e.target.id === 'eName'){ it.name = e.target.value; commit(false); }
  if(e.target.id === 'eNote'){ it.note = e.target.value; commit(false); }
});
$('#editBody').addEventListener('change', e => {
  const it = curItem(); if(!it) return;
  if(e.target.id === 'eFixed'){
    const list = items(), s = schedule(list)[list.indexOf(it)];
    it.fixed = e.target.checked; if(it.fixed) it.at = s.start;
    if(list.indexOf(it) === 0) it.fixed = true;
    commit();
  }
  if(e.target.id === 'eAt' && e.target.value){ it.at = toMin(e.target.value); commit(); }
  if(e.target.id === 'eWet'){ it.wet = e.target.checked; commit(); }
});

/* ---------- catálogo ---------- */
function openCatalog(afterId){
  const list = items(), sc = schedule(list);
  const sel = afterId ?? (list.length ? list[list.length-1].id : '__start');
  $('#afterSel').innerHTML = `<option value="__start">Al inicio del día</option>` +
    list.map((it,i) => `<option value="${it.id}" ${it.id===sel?'selected':''}>${fmt(sc[i].start)} · ${esc(it.name)}</option>`).join('');
  $('#q').value = '';
  renderCatalog('');
  openSheet('catSheet');
  $('#catSheet').scrollTop = 0;
}
function catLine(c){
  if(c.type === 'ride'){
    const p = [];
    if(c.qMax) p.push(`${c.qMin}–${c.qMax} fila`);
    if(c.ride) p.push(`+ ${rideFmt(c.ride)}`);
    p.push(`ocupa ~${ceil5(c.qMax + c.ride/60 + 5)} min`);
    return p.join(' · ');
  }
  return `ocupa ${c.dur} min${c.note ? ' · ' + c.note : ''}`;
}
function renderCatalog(q){
  q = q.trim().toLowerCase();
  let html = `<button class="ci" data-custom="1" style="--z:#94a3b8"><span class="x"><b>Actividad personalizada</b><small>Escribe tú el nombre y los minutos</small></span><span class="plus">＋</span></button>`;
  CAT.forEach(([g, arr], gi) => {
    const rows = arr.map((c,ci) => ({c,ci})).filter(({c}) => !q || (c.name + ' ' + g).toLowerCase().includes(q));
    if(!rows.length) return;
    html += `<div class="grp" style="--gz:${zc(arr[0].zone)}">${g}</div>` + rows.map(({c,ci}) =>
      `<button class="ci" data-g="${gi}" data-c="${ci}" style="--z:${zc(c.zone)};--zb:${zbg(c.zone, true)}"><span class="x"><b>${esc(c.name)}</b><small>${esc(catLine(c))}</small></span><span class="plus">＋</span></button>`).join('');
  });
  $('#catList').innerHTML = html;
}
$('#q').addEventListener('input', e => renderCatalog(e.target.value));
$('#catList').addEventListener('click', e => {
  const b = e.target.closest('button.ci'); if(!b) return;
  let it;
  if(b.dataset.custom){
    it = { id:uid(), name:'Nueva actividad', note:'', zone:'log', type:'other', qMin:0,qMax:0,ride:0,lk:'',wet:false,walk:5, fixed:false, at:null, dur:30 };
  } else {
    const c = CAT[+b.dataset.g][1][+b.dataset.c];
    it = { id:uid(), name:c.name, note:c.note||'', zone:c.zone, type:c.type, qMin:c.qMin||0, qMax:c.qMax||0, ride:c.ride||0,
      lk:c.lk||'', wet:!!c.wet, walk:5, fixed:false, at:null, dur:c.dur||0 };
    if(it.type === 'ride') it.dur = rideDur(it);
  }
  const list = items(), after = $('#afterSel').value;
  undoSnap = { key:DAYS[cur].key, list: JSON.parse(JSON.stringify(list)) };
  let idx = after === '__start' ? 0 : list.findIndex(x => x.id === after) + 1;
  if(idx === 0){
    const s0 = list.length ? schedule(list)[0].start : 480;
    it.fixed = true; it.at = s0;
  }
  list.splice(idx, 0, it);
  save(); closeSheets(); render();
  const el = document.querySelector(`.row[data-id="${it.id}"]`);
  if(el){ el.scrollIntoView({block:'center', behavior:'smooth'}); el.classList.add('flash'); }
  toast(`Agregado: ${it.name}`);
  if(b.dataset.custom) setTimeout(() => { openEdit(it.id); const n = $('#eName'); n && n.select(); }, 350);
});

/* ---------- toast con deshacer ---------- */
function toast(msg){
  $('#toastMsg').textContent = msg;
  $('#toastUndo').style.display = undoSnap ? '' : 'none';
  $('#toast').classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('#toast').classList.remove('on'), 4500);
}
$('#toastUndo').onclick = () => {
  if(!undoSnap) return;
  state.days[undoSnap.key] = undoSnap.list; undoSnap = null;
  save(); render(); $('#toast').classList.remove('on');
};

/* ---------- eventos generales ---------- */
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if(!b) return;
  cur = +b.dataset.i;
  try { localStorage.setItem('uo27.tab', cur); } catch(err) {}
  renderTabs(); render(); window.scrollTo({top:0});
});
$('#list').addEventListener('click', e => {
  const b = e.target.closest('.row'); if(b) openEdit(b.dataset.id);
});
$('#fab').onclick = () => openCatalog();
$('#resetBtn').onclick = () => {
  if(!confirm('¿Restaurar el itinerario original de este día? Se pierden los cambios que hiciste en este día.')) return;
  undoSnap = { key:DAYS[cur].key, list: JSON.parse(JSON.stringify(items())) };
  state.days[DAYS[cur].key] = build(DAYS[cur].seed);
  save(); render(); window.scrollTo({top:0}); toast('Día restaurado');
};

renderTabs(); render(); renderCountdown();
setInterval(() => { renderCountdown(); if(DAYS[cur].key === todayKey && !editId) render(); }, 30000);
if(todayIdx >= 0){ const n = document.querySelector('.row.now'); n && setTimeout(() => n.scrollIntoView({block:'center'}), 300); }
</script>
</body>
